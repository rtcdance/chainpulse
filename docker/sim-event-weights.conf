# ChainPulse Event Simulator — Event Type Weights
# =================================================
# This file defines the weighted distribution for random event type selection.
# Each WEIGHT_<NAME> is a cumulative percentile threshold. The values must
# be integers in ascending order, with the last value ≤ 100.
#
# Distribution logic: pick=$((RANDOM % 100))  then walk thresholds.
#
# Default distribution (DeFi + NFT + L2):
#   ERC-20 ops:  30%  (Transfer 22, Approval 8)
#   DeFi V1:     44%  (UniV3Swap 10, Aave Supply 8, Withdraw 8, Borrow 8,
#                       LiquidationCall 5, CometSupply 5, VoteCast 5, BridgeEvent 5)
#   V2 events:   16%  (ERC1155 5, AaveRepay 2, UniV2Swap 2, CometWithdraw 2,
#                       CometBorrow 1, ProposalCreated 1, L2SentMessage 1, L2TxToL2 1)
#   NFT ops:      4%  (NFTTransfer 2, NFTApproval 1, NFTApprovalForAll 1)
#   Edge cases:   2%  (zero-value, gas-exhaustion, max-approval)
# -------------------------------------------------

# ERC-20 Token operations (30%)
WEIGHT_Transfer=22
WEIGHT_Approval=8

# RealEventEmitter DeFi events (44%)
WEIGHT_UniV3Swap=10
WEIGHT_AaveSupply=8
WEIGHT_AaveWithdraw=8
WEIGHT_AaveBorrow=8
WEIGHT_LiquidationCall=5
WEIGHT_CometSupply=5
WEIGHT_VoteCast=5
WEIGHT_BridgeEvent=5

# V2 extended protocol events (16%)
WEIGHT_ERC1155=5
WEIGHT_AaveRepayV2=2
WEIGHT_UniV2SwapV2=2
WEIGHT_CometWithdrawV2=2
WEIGHT_CometBorrowV2=1
WEIGHT_ProposalCreatedV2=1
WEIGHT_L2SentMessage=1
WEIGHT_L2TxToL2=1

# NFT operations (4%)
WEIGHT_NFTTransfer=2
WEIGHT_NFTApproval=1
WEIGHT_NFTApprovalForAll=1

# Edge cases (residual ~2%)
