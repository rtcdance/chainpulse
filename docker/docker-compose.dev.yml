x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    <<: *default-logging
    container_name: chainpulse-postgres
    command:
      - "postgres"
      - "-c"
      - "max_connections=20"
      - "-c"
      - "shared_buffers=64MB"
      - "-c"
      - "effective_cache_size=256MB"
      - "-c"
      - "synchronous_commit=off"
      - "-c"
      - "wal_level=minimal"
      - "-c"
      - "full_page_writes=off"
      - "-c"
      - "commit_delay=100000"
      - "-c"
      - "bgwriter_delay=500ms"
      - "-c"
      - "bgwriter_lru_maxpages=20"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "max_wal_size=256MB"
      - "-c"
      - "min_wal_size=32MB"
      - "-c"
      - "max_wal_senders=0"
      - "-c"
      - "max_replication_slots=0"
      - "-c"
      - "autovacuum=off"
    environment:
      POSTGRES_USER: chainpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: chainpulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainpulse -d chainpulse"]
      interval: 60s
      timeout: 5s
      retries: 3
    networks:
      - chainpulse
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  # Redis 缓存
  redis:
    image: redis:7-alpine
    <<: *default-logging
    container_name: chainpulse-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save "" --hz 5 --dynamic-hz no --lazyfree-lazy-eviction yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 60s
      timeout: 5s
      retries: 3
    networks:
      - chainpulse
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 128M

  # Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    <<: *default-logging
    container_name: chainpulse-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 3000
      ZOOKEEPER_SNAP_COUNT: 500000
      ZOOKEEPER_PURGE_INTERVAL: 24
      ZOOKEEPER_AUTOPURGE_SNAP_RETAIN_COUNT: 5
      ZOOKEEPER_HEAP_OPTS: "-Xms128M -Xmx256M"
      ZOOKEEPER_MAX_CLIENT_CNXNS: 30
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 256M
    networks:
      - chainpulse

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    <<: *default-logging
    container_name: chainpulse-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: "1"
      KAFKA_TRANSACTION_STATE_LOG_NUM_PARTITIONS: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xms128M -Xmx256M"
      KAFKA_NUM_NETWORK_THREADS: "1"
      KAFKA_NUM_IO_THREADS: "1"
      KAFKA_BACKGROUND_THREADS: "1"
      KAFKA_LOG_CLEANER_THREADS: "1"
      KAFKA_LOG_CLEANER_DEDUPE_BUFFER_SIZE: 67108864
      KAFKA_LOG_CLEANER_BACKOFF_MS: 600000
      KAFKA_LOG_FLUSH_INTERVAL_MS: 600000
      KAFKA_COMPRESSION_TYPE: producer
      KAFKA_LOG_RETENTION_HOURS: "2"
      KAFKA_LOG_RETENTION_BYTES: "107374182"
      KAFKA_LOG_SEGMENT_BYTES: "53687091"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - chainpulse
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 1G

  # Kafka UI (可选)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    <<: *default-logging
    container_name: chainpulse-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - chainpulse
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 256M

  # Prometheus 监控
  prometheus:
    image: prom/prometheus:v2.47.0
    <<: *default-logging
    container_name: chainpulse-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.min-block-duration=2h'
    networks:
      - chainpulse
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 256M

  # Grafana 看板
  grafana:
    image: grafana/grafana:10.1.0
    <<: *default-logging
    container_name: chainpulse-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ALERTING_ENABLED: "false"
      GF_UNIFIED_ALERTING_ENABLED: "false"
      GF_LIVE_MAX_CHANNELS: "5"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: "5m"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - chainpulse
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 256M

  # Jaeger 追踪
  jaeger:
    image: jaegertracing/all-in-one:1.49
    <<: *default-logging
    container_name: chainpulse-jaeger
    ports:
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - chainpulse
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 256M

  # Alertmanager
  alertmanager:
    image: prom/alertmanager:v0.26.0
    <<: *default-logging
    container_name: chainpulse-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ../monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    networks:
      - chainpulse
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 128M

  # Consul 服务发现
  consul:
    image: consul:1.16
    <<: *default-logging
    container_name: chainpulse-consul
    ports:
      - "8500:8500"
    volumes:
      - consul_data:/consul/data
    command: consul agent -server -ui -bind=0.0.0.0 -client=0.0.0.0 -bootstrap-expect=1
    networks:
      - chainpulse
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 256M

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  consul_data:

networks:
  chainpulse:
    driver: bridge
