# ChainPulse Microservices Full Acceptance Stack
# Usage: docker compose -f docker-compose.acceptance-microservices.yml up -d
#
# Includes: 7 Anvil chains + PostgreSQL + Redis + MongoDB + Kafka + 4 Microservices + Frontend + Observability
# Prerequisites: Run `bash docker/acceptance-microservices.sh build` first to build images

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ============================================
  # Blockchain Nodes (Anvil) - 7 Chains
  # ============================================

  anvil-ethereum: &anvil-node-ms
    image: ghcr.io/foundry-rs/foundry:latest
    <<: *default-logging
    container_name: chainpulse-ms-anvil-ethereum
    environment:
      ANVIL_IP_ADDR: "0.0.0.0"
    ports:
      - "18545:8545"
    command: anvil --host 0.0.0.0 --port 8545 --chain-id 1 --accounts 5 --balance 10000 --block-time 3 --timestamp 0
    healthcheck:
      test: ["CMD-SHELL", "cast chain --rpc-url http://localhost:8545 2>/dev/null || curl -sf -X POST http://localhost:8545 -H 'Content-Type: application/json' -d '{\"jsonrpc\":\"2.0\",\"method\":\"eth_blockNumber\",\"params\":[],\"id\":1}'"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - chainpulse-ms-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  anvil-polygon:
    <<: *anvil-node-ms
    container_name: chainpulse-ms-anvil-polygon
    ports:
      - "18546:8545"
    command: anvil --host 0.0.0.0 --port 8545 --chain-id 137 --accounts 5 --balance 10000 --block-time 3 --timestamp 0

  anvil-bsc:
    <<: *anvil-node-ms
    container_name: chainpulse-ms-anvil-bsc
    ports:
      - "18547:8545"
    command: anvil --host 0.0.0.0 --port 8545 --chain-id 97 --accounts 5 --balance 10000 --block-time 3 --timestamp 0

  anvil-arbitrum:
    <<: *anvil-node-ms
    container_name: chainpulse-ms-anvil-arbitrum
    ports:
      - "18548:8545"
    command: anvil --host 0.0.0.0 --port 8545 --chain-id 421614 --accounts 5 --balance 10000 --block-time 3 --timestamp 0

  anvil-optimism:
    <<: *anvil-node-ms
    container_name: chainpulse-ms-anvil-optimism
    ports:
      - "18549:8545"
    command: anvil --host 0.0.0.0 --port 8545 --chain-id 11155420 --accounts 5 --balance 10000 --block-time 3 --timestamp 0

  anvil-base:
    <<: *anvil-node-ms
    container_name: chainpulse-ms-anvil-base
    ports:
      - "18550:8545"
    command: anvil --host 0.0.0.0 --port 8545 --chain-id 84532 --accounts 5 --balance 10000 --block-time 3 --timestamp 0

  anvil-avalanche:
    <<: *anvil-node-ms
    container_name: chainpulse-ms-anvil-avalanche
    ports:
      - "18551:8545"
    command: anvil --host 0.0.0.0 --port 8545 --chain-id 43113 --accounts 5 --balance 10000 --block-time 3 --timestamp 0

  # ============================================
  # Infrastructure Services
  # ============================================

  postgres:
    image: postgres:15-alpine
    <<: *default-logging
    container_name: chainpulse-ms-postgres
    command:
      - "postgres"
      - "-c"
      - "max_connections=20"
      - "-c"
      - "shared_buffers=64MB"
      - "-c"
      - "effective_cache_size=256MB"
      - "-c"
      - "synchronous_commit=off"
      - "-c"
      - "wal_level=minimal"
      - "-c"
      - "full_page_writes=off"
      - "-c"
      - "commit_delay=100000"
      - "-c"
      - "bgwriter_delay=500ms"
      - "-c"
      - "bgwriter_lru_maxpages=20"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "max_wal_size=256MB"
      - "-c"
      - "min_wal_size=32MB"
      - "-c"
      - "max_wal_senders=0"
      - "-c"
      - "max_replication_slots=0"
      - "-c"
      - "autovacuum=off"
    environment:
      POSTGRES_USER: chainpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: chainpulse
    ports:
      - "25432:5432"
    volumes:
      - ms_postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainpulse -d chainpulse"]
      interval: 60s
      timeout: 5s
      retries: 3
    networks:
      chainpulse-ms-network:
        aliases:
          - postgres-primary
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  redis:
    image: redis:7-alpine
    <<: *default-logging
    container_name: chainpulse-ms-redis
    ports:
      - "16379:6379"
    volumes:
      - ms_redis_data:/data
    command: redis-server --save "" --hz 5 --dynamic-hz no --lazyfree-lazy-eviction yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 60s
      timeout: 5s
      retries: 3
    networks:
      chainpulse-ms-network:
        aliases:
          - redis-1
          - redis-2
          - redis-3
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M

  mongodb:
    image: mongo:7
    <<: *default-logging
    container_name: chainpulse-ms-mongodb
    ports:
      - "27018:27017"
    volumes:
      - ms_mongo_data:/data/db
    command: mongod --wiredTigerCacheSizeGB 0.25 --setParameter diagnosticDataCollectionEnabled=false --wiredTigerJournalCompressor none --setParameter storageEngineConcurrentReadTransactions=8 --setParameter storageEngineConcurrentWriteTransactions=5
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      chainpulse-ms-network:
        aliases:
          - mongodb
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512M

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    <<: *default-logging
    container_name: chainpulse-ms-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 3000
      ZOOKEEPER_SNAP_COUNT: 500000
      ZOOKEEPER_PURGE_INTERVAL: 24
      ZOOKEEPER_AUTOPURGE_SNAP_RETAIN_COUNT: 5
      ZOOKEEPER_HEAP_OPTS: "-Xms128M -Xmx256M"
      ZOOKEEPER_MAX_CLIENT_CNXNS: 30
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 | grep -q Mode"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - chainpulse-ms-network
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 256M

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    <<: *default-logging
    container_name: chainpulse-ms-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "19092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,PLAINTEXT_HOST://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: "1"
      KAFKA_TRANSACTION_STATE_LOG_NUM_PARTITIONS: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xms128M -Xmx256M"
      KAFKA_NUM_NETWORK_THREADS: "1"
      KAFKA_NUM_IO_THREADS: "1"
      KAFKA_BACKGROUND_THREADS: "1"
      KAFKA_LOG_CLEANER_THREADS: "1"
      KAFKA_LOG_CLEANER_DEDUPE_BUFFER_SIZE: 67108864
      KAFKA_LOG_CLEANER_BACKOFF_MS: 600000
      KAFKA_LOG_FLUSH_INTERVAL_MS: 600000
      KAFKA_COMPRESSION_TYPE: producer
      KAFKA_LOG_RETENTION_HOURS: "2"
      KAFKA_LOG_RETENTION_BYTES: "107374182"
      KAFKA_LOG_SEGMENT_BYTES: "53687091"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka-1:9092"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      chainpulse-ms-network:
        aliases:
          - kafka-1
          - kafka-2
          - kafka-3
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 768M

  # ============================================
  # ChainPulse Microservices
  # ============================================

  puller:
    image: chainpulse-puller:latest
    <<: *default-logging
    container_name: chainpulse-ms-puller
    depends_on:
      anvil-ethereum:
        condition: service_healthy
      anvil-polygon:
        condition: service_healthy
      anvil-bsc:
        condition: service_healthy
      anvil-arbitrum:
        condition: service_healthy
      anvil-optimism:
        condition: service_healthy
      anvil-base:
        condition: service_healthy
      anvil-avalanche:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      PULLER_PORT: "8083"
      INSTANCE_ID: puller-1
      KAFKA_BROKERS: "kafka-1:9092,kafka-2:9092,kafka-3:9092"
      KAFKA_OUTPUT_TOPICS: "raw-events,blockchain-events"
      BLOCKCHAIN_RPCS: "ethereum=http://anvil-ethereum:8545,polygon=http://anvil-polygon:8545,bsc=http://anvil-bsc:8545,arbitrum=http://anvil-arbitrum:8545,optimism=http://anvil-optimism:8545,base=http://anvil-base:8545,avalanche=http://anvil-avalanche:8545"
      BLOCK_CONFIRMATION: "12"
      POLL_INTERVAL: "30"
      STATE_BACKEND: "memory"
      DATABASE_URL: "postgres://chainpulse:chainpulse_dev@postgres-primary:5432/chainpulse?sslmode=disable"
      MONGODB_URI: "mongodb://mongodb:27017"
      DEPLOYMENT_MODE: microservices
      LOG_LEVEL: error
      GOMEMLIMIT: 200MiB
      GOGC: "100"
    ports:
      - "18083:8083"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8083 || exit 1"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks:
      - chainpulse-ms-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  event-processor:
    image: chainpulse-event-processor:latest
    <<: *default-logging
    container_name: chainpulse-ms-event-processor
    depends_on:
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      PROCESSOR_PORT: "8082"
      INSTANCE_ID: event-processor-1
      BATCH_SIZE: "100"
      EVENT_TTL_DAYS: "30"
      DATABASE_URL: "postgres://chainpulse:chainpulse_dev@postgres-primary:5432/chainpulse?sslmode=disable"
      MONGODB_URI: "mongodb://mongodb:27017"
      KAFKA_BROKERS: "kafka-1:9092,kafka-2:9092,kafka-3:9092"
      KAFKA_INPUT_TOPICS: "raw-events,blockchain-events"
      DEPLOYMENT_MODE: microservices
      LOG_LEVEL: error
      GOMEMLIMIT: 200MiB
      GOGC: "100"
    ports:
      - "18082:8082"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8082 || exit 1"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks:
      - chainpulse-ms-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  api-service:
    image: chainpulse-api-service:latest
    <<: *default-logging
    container_name: chainpulse-ms-api-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      API_SERVICE_PORT: "8081"
      INSTANCE_ID: api-service-1
      API_SERVICE_DB_HOST: postgres-primary
      API_SERVICE_DB_PORT: "5432"
      DATABASE_URL: "postgres://chainpulse:chainpulse_dev@postgres-primary:5432/chainpulse?sslmode=disable"
      MONGODB_URI: "mongodb://mongodb:27017"
      DB_TIMEOUT_MS: "15000"
      DEPLOYMENT_MODE: microservices
      LOG_LEVEL: error
      API_SERVICE_KAFKA_BROKERS: "kafka-1:9092"
      API_SERVICE_KAFKA_CONSUMER_GROUP: "api-service-consumers"
      GOMEMLIMIT: 200MiB
      GOGC: "100"
    ports:
      - "18081:8081"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8081 || exit 1"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks:
      - chainpulse-ms-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  api-gateway:
    image: chainpulse-api-gateway:latest
    <<: *default-logging
    container_name: chainpulse-ms-api-gateway
    depends_on:
      api-service:
        condition: service_healthy
    environment:
      GATEWAY_PORT: "8080"
      INSTANCE_ID: api-gateway-1
      GATEWAY_UPSTREAM_SERVICES: "http://api-service:8081"
      DEPLOYMENT_MODE: microservices
      LOG_LEVEL: error
      GOMEMLIMIT: 200MiB
      GOGC: "100"
    ports:
      - "28080:8080"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080 || exit 1"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks:
      - chainpulse-ms-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 256M

  # ============================================
  # Frontend (React + Nginx - Microservices Mode)
  # ============================================

  frontend:
    image: chainpulse-frontend-microservices:latest
    <<: *default-logging
    container_name: chainpulse-ms-frontend
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "13000:3000"
    networks:
      - chainpulse-ms-network
    restart: unless-stopped

  # ============================================
  # Observability Stack
  # ============================================

  prometheus:
    image: prom/prometheus:v2.47.0
    <<: *default-logging
    container_name: chainpulse-ms-prometheus
    ports:
      - "29090:9090"
    volumes:
      - ./monitoring/prometheus-microservices.yml:/etc/prometheus/prometheus.yml:ro
      - ms_prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.min-block-duration=2h'
      - '--web.enable-lifecycle'
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - chainpulse-ms-network
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M

  grafana:
    image: grafana/grafana:10.1.0
    <<: *default-logging
    container_name: chainpulse-ms-grafana
    ports:
      - "13001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ALERTING_ENABLED: "false"
      GF_UNIFIED_ALERTING_ENABLED: "false"
      GF_LIVE_MAX_CHANNELS: "5"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: "5m"
    volumes:
      - ms_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - chainpulse-ms-network
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M

  jaeger:
    image: jaegertracing/all-in-one:1.49
    <<: *default-logging
    container_name: chainpulse-ms-jaeger
    ports:
      - "16687:16686"
      - "14317:4317"
      - "14318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - chainpulse-ms-network
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 256M

volumes:
  ms_postgres_data:
  ms_redis_data:
  ms_mongo_data:
  ms_prometheus_data:
  ms_grafana_data:

networks:
  chainpulse-ms-network:
    driver: bridge
