# ChainPulse Quickstart Stack
# Lightweight version with 1 blockchain node + essential infrastructure.
# Use for local development and quick testing.
# Usage: docker compose -f docker-compose.quickstart.yml up -d

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # Single Anvil blockchain node (Ethereum)
  anvil-ethereum:
    image: ghcr.io/foundry-rs/foundry:latest
    <<: *default-logging
    container_name: chainpulse-anvil-ethereum
    ports:
      - "8545:8545"
    command: anvil --host 0.0.0.0 --port 8545 --chain-id 1 --accounts 5 --balance 10000 --block-time 3
    healthcheck:
      test: ["CMD-SHELL", "cast chain --rpc-url http://localhost:8545 2>/dev/null || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - chainpulse-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  # PostgreSQL for persistent storage
  postgres:
    image: postgres:15-alpine
    <<: *default-logging
    container_name: chainpulse-postgres
    command:
      - "postgres"
      - "-c"
      - "max_connections=20"
      - "-c"
      - "shared_buffers=64MB"
      - "-c"
      - "effective_cache_size=256MB"
      - "-c"
      - "synchronous_commit=off"
      - "-c"
      - "wal_level=minimal"
      - "-c"
      - "full_page_writes=off"
      - "-c"
      - "commit_delay=100000"
      - "-c"
      - "bgwriter_delay=500ms"
      - "-c"
      - "bgwriter_lru_maxpages=20"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "max_wal_size=256MB"
      - "-c"
      - "min_wal_size=32MB"
      - "-c"
      - "max_wal_senders=0"
      - "-c"
      - "max_replication_slots=0"
      - "-c"
      - "autovacuum=off"
    environment:
      POSTGRES_USER: chainpulse
      POSTGRES_PASSWORD: chainpulse_dev
      POSTGRES_DB: chainpulse_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainpulse -d chainpulse"]
      interval: 60s
      timeout: 5s
      retries: 3
    networks:
      - chainpulse-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  # Redis for caching
  redis:
    image: redis:7-alpine
    <<: *default-logging
    container_name: chainpulse-redis
    ports:
      - "6379:6379"
    command: redis-server --save "" --hz 5 --dynamic-hz no --lazyfree-lazy-eviction yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 60s
      timeout: 5s
      retries: 3
    networks:
      - chainpulse-network
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 128M

  # MongoDB for event store
  mongodb:
    image: mongo:7
    <<: *default-logging
    container_name: chainpulse-mongodb
    command: ["--wiredTigerCacheSizeGB", "0.25", "--setParameter", "diagnosticDataCollectionEnabled=false", "--wiredTigerJournalCompressor", "none", "--setParameter", "storageEngineConcurrentReadTransactions=8", "--setParameter", "storageEngineConcurrentWriteTransactions=5"]
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - chainpulse-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 1G

  # ChainPulse monolithic application
  chainpulse:
    image: chainpulse-acceptance:latest
    <<: *default-logging
    container_name: chainpulse-app
    depends_on:
      anvil-ethereum:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      CHAINS: ethereum
      BLOCKCHAIN_NODE_URLS: http://anvil-ethereum:8545
      DATA_PULLER_TYPE: https-jsonrpc
      DEPLOYMENT_MODE: monolithic
      LOG_LEVEL: error
      API_PORT: "8080"
      CACHE_TYPE: redis
      CACHE_CONNECTION_URL: redis://redis:6379
      DATABASE_URL: postgres://chainpulse:chainpulse_dev@postgres:5432/chainpulse?sslmode=disable
      MONGODB_URI: mongodb://mongodb:27017
      GOMAXPROCS: "2"
      GOMEMLIMIT: "400MiB"
      GOGC: "200"
      MQ_TYPE: redis
      WORKER_POOL_SIZE: "2"
      BATCH_SIZE: "10"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks:
      - chainpulse-network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

volumes:
  postgres_data:

networks:
  chainpulse-network:
    driver: bridge