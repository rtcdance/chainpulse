# ChainPulse Full Acceptance Stack
# Usage: docker compose -f docker-compose.acceptance.yml up -d
#
# Includes: 7 Anvil chains + PostgreSQL + Redis + MongoDB + Kafka + ChainPulse + Frontend + Observability
# Prerequisites: Run `bash docker/acceptance.sh build` first to build images

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ============================================
  # Blockchain Nodes (Anvil) - 7 Chains
  # ============================================

  anvil-ethereum: &anvil-node
    image: ghcr.io/foundry-rs/foundry:latest
    <<: *default-logging
    container_name: chainpulse-anvil-ethereum
    environment:
      ANVIL_IP_ADDR: "0.0.0.0"
    ports:
      - "8545:8545"
    command: anvil --host 0.0.0.0 --port 8545 --chain-id 1 --accounts 5 --balance 10000 --block-time 3 --timestamp 0
    healthcheck:
      test: ["CMD-SHELL", "cast chain --rpc-url http://localhost:8545 2>/dev/null || curl -sf -X POST http://localhost:8545 -H 'Content-Type: application/json' -d '{\"jsonrpc\":\"2.0\",\"method\":\"eth_blockNumber\",\"params\":[],\"id\":1}'"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - chainpulse-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  anvil-polygon:
    <<: *anvil-node
    container_name: chainpulse-anvil-polygon
    ports:
      - "8546:8545"
    command: anvil --host 0.0.0.0 --port 8545 --chain-id 137 --accounts 5 --balance 10000 --block-time 3 --timestamp 0

  anvil-bsc:
    <<: *anvil-node
    container_name: chainpulse-anvil-bsc
    ports:
      - "8547:8545"
    command: anvil --host 0.0.0.0 --port 8545 --chain-id 97 --accounts 5 --balance 10000 --block-time 3 --timestamp 0

  anvil-arbitrum:
    <<: *anvil-node
    container_name: chainpulse-anvil-arbitrum
    ports:
      - "8548:8545"
    command: anvil --host 0.0.0.0 --port 8545 --chain-id 421614 --accounts 5 --balance 10000 --block-time 3 --timestamp 0

  anvil-optimism:
    <<: *anvil-node
    container_name: chainpulse-anvil-optimism
    ports:
      - "8549:8545"
    command: anvil --host 0.0.0.0 --port 8545 --chain-id 11155420 --accounts 5 --balance 10000 --block-time 3 --timestamp 0

  anvil-base:
    <<: *anvil-node
    container_name: chainpulse-anvil-base
    ports:
      - "8550:8545"
    command: anvil --host 0.0.0.0 --port 8545 --chain-id 84532 --accounts 5 --balance 10000 --block-time 3 --timestamp 0

  anvil-avalanche:
    <<: *anvil-node
    container_name: chainpulse-anvil-avalanche
    ports:
      - "8551:8545"
    command: anvil --host 0.0.0.0 --port 8545 --chain-id 43113 --accounts 5 --balance 10000 --block-time 3 --timestamp 0

  # ============================================
  # Infrastructure Services
  # ============================================

  postgres:
    image: postgres:15-alpine
    <<: *default-logging
    container_name: chainpulse-postgres
    command:
      - "postgres"
      - "-c"
      - "max_connections=20"
      - "-c"
      - "shared_buffers=64MB"
      - "-c"
      - "effective_cache_size=256MB"
      - "-c"
      - "synchronous_commit=off"
      - "-c"
      - "wal_level=minimal"
      - "-c"
      - "full_page_writes=off"
      - "-c"
      - "commit_delay=100000"
      - "-c"
      - "bgwriter_delay=500ms"
      - "-c"
      - "bgwriter_lru_maxpages=20"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "max_wal_size=256MB"
      - "-c"
      - "min_wal_size=32MB"
      - "-c"
      - "max_wal_senders=0"
      - "-c"
      - "max_replication_slots=0"
      - "-c"
      - "autovacuum=off"
    environment:
      POSTGRES_USER: chainpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: chainpulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainpulse -d chainpulse"]
      interval: 60s
      timeout: 5s
      retries: 3
    networks:
      - chainpulse-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  redis:
    image: redis:7-alpine
    <<: *default-logging
    container_name: chainpulse-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save "" --hz 5 --dynamic-hz no --lazyfree-lazy-eviction yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 60s
      timeout: 5s
      retries: 3
    networks:
      - chainpulse-network
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M

  mongodb:
    image: mongo:7
    <<: *default-logging
    container_name: chainpulse-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    command: mongod --wiredTigerCacheSizeGB 0.25 --setParameter diagnosticDataCollectionEnabled=false --wiredTigerJournalCompressor none --setParameter storageEngineConcurrentReadTransactions=8 --setParameter storageEngineConcurrentWriteTransactions=5
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - chainpulse-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512M

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    <<: *default-logging
    container_name: chainpulse-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 3000
      ZOOKEEPER_SNAP_COUNT: 500000
      ZOOKEEPER_PURGE_INTERVAL: 24
      ZOOKEEPER_AUTOPURGE_SNAP_RETAIN_COUNT: 5
      ZOOKEEPER_HEAP_OPTS: "-Xms128M -Xmx256M"
      ZOOKEEPER_MAX_CLIENT_CNXNS: 30
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 | grep -q Mode"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - chainpulse-network
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 256M

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    <<: *default-logging
    container_name: chainpulse-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: "1"
      KAFKA_TRANSACTION_STATE_LOG_NUM_PARTITIONS: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xms128M -Xmx256M"
      KAFKA_NUM_NETWORK_THREADS: "1"
      KAFKA_NUM_IO_THREADS: "1"
      KAFKA_BACKGROUND_THREADS: "1"
      KAFKA_LOG_CLEANER_THREADS: "1"
      KAFKA_LOG_CLEANER_DEDUPE_BUFFER_SIZE: 67108864
      KAFKA_LOG_CLEANER_BACKOFF_MS: 600000
      KAFKA_LOG_FLUSH_INTERVAL_MS: 600000
      KAFKA_COMPRESSION_TYPE: producer
      KAFKA_LOG_RETENTION_HOURS: "2"
      KAFKA_LOG_RETENTION_BYTES: "107374182"
      KAFKA_LOG_SEGMENT_BYTES: "53687091"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - chainpulse-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 768M

  # ============================================
  # ChainPulse Application (Monolithic)
  # ============================================

  chainpulse:
    image: chainpulse-acceptance:latest
    <<: *default-logging
    container_name: chainpulse-app
    depends_on:
      anvil-ethereum:
        condition: service_healthy
      anvil-polygon:
        condition: service_healthy
      anvil-bsc:
        condition: service_healthy
      anvil-arbitrum:
        condition: service_healthy
      anvil-optimism:
        condition: service_healthy
      anvil-base:
        condition: service_healthy
      anvil-avalanche:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      CHAINS: ethereum,polygon,bsc,arbitrum,optimism,base,avalanche
      BLOCKCHAIN_NODE_URLS: http://anvil-ethereum:8545,http://anvil-polygon:8545,http://anvil-bsc:8545,http://anvil-arbitrum:8545,http://anvil-optimism:8545,http://anvil-base:8545,http://anvil-avalanche:8545
      DATA_PULLER_TYPE: https-jsonrpc
      DEPLOYMENT_MODE: monolithic
      LOG_LEVEL: error
      API_PORT: "8080"
      GRPC_PORT: "50051"
      WORKER_POOL_SIZE: "4"
      BATCH_SIZE: "100"
      CACHE_TYPE: redis
      CACHE_CONNECTION_URL: redis://redis:6379
      DATABASE_TYPE: postgres
      DATABASE_URL: ${DATABASE_URL}
      MONGODB_URI: mongodb://mongodb:27017
      MQ_TYPE: kafka
      MQ_CONNECTION_URL: kafka:29092
      MONOLITHIC_DLQ_RETENTION: 168h
      GOMEMLIMIT: 800MiB
      GOGC: "100"
    ports:
      - "8080:8080"
      - "50051:50051"
    networks:
      chainpulse-network:
        aliases:
          - api-gateway
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G

  # ============================================
  # Frontend (React + Nginx)
  # ============================================

  frontend:
    image: chainpulse-frontend:latest
    container_name: chainpulse-frontend
    <<: *default-logging
    depends_on:
      chainpulse:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - chainpulse-network
    restart: unless-stopped

  # ============================================
  # Observability Stack
  # ============================================

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: chainpulse-prometheus
    <<: *default-logging
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.min-block-duration=2h'
      - '--web.enable-lifecycle'
    depends_on:
      chainpulse:
        condition: service_healthy
    networks:
      - chainpulse-network
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M

  grafana:
    image: grafana/grafana:10.1.0
    <<: *default-logging
    container_name: chainpulse-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ALERTING_ENABLED: "false"
      GF_UNIFIED_ALERTING_ENABLED: "false"
      GF_LIVE_MAX_CHANNELS: "5"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: "5m"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - chainpulse-network
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M

  jaeger:
    image: jaegertracing/all-in-one:1.49
    <<: *default-logging
    container_name: chainpulse-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - chainpulse-network
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 256M

volumes:
  postgres_data:
  redis_data:
  mongo_data:
  prometheus_data:
  grafana_data:

networks:
  chainpulse-network:
    driver: bridge
