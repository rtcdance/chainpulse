global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'chainpulse-api-gateway'
    static_configs:
      - targets: ['api-gateway:8080']
        labels:
          service: 'api-gateway'

  - job_name: 'chainpulse-api-service'
    static_configs:
      - targets: ['api-service:8081']
        labels:
          service: 'api-service'

  - job_name: 'chainpulse-event-processor'
    static_configs:
      - targets: ['event-processor:8082']
        labels:
          service: 'event-processor'

  - job_name: 'chainpulse-puller'
    static_configs:
      - targets: ['puller:8083']
        labels:
          service: 'puller'
