services:
  postgres:
    image: postgres:15-alpine
    container_name: chainpulse-postgres
    environment:
      POSTGRES_USER: chainpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: chainpulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainpulse -d chainpulse"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      chainpulse:
        aliases:
          - postgres-primary

  redis:
    image: redis:7-alpine
    container_name: chainpulse-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      chainpulse:
        aliases:
          - redis-1
          - redis-2
          - redis-3

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: chainpulse-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - chainpulse

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: chainpulse-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    restart: on-failure
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      chainpulse:
        aliases:
          - kafka-1
          - kafka-2
          - kafka-3

  anvil:
    image: ${ANVIL_IMAGE:-ghcr.io/foundry-rs/foundry:latest}
    platform: linux/amd64
    container_name: chainpulse-anvil
    entrypoint: ["anvil"]
    volumes:
      - anvil_svm_cache:/root/.svm
    ports:
      - "8545:8545"
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8545"
      - "--chain-id"
      - "31337"
      - "--accounts"
      - "10"
      - "--balance"
      - "10000"
    healthcheck:
      test: ["CMD", "cast", "rpc", "--rpc-url", "http://127.0.0.1:8545", "eth_chainId"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      chainpulse:
        aliases:
          - ethereum-rpc

  # ── Multi-chain Anvil nodes ──
  # Each node runs as a separate anvil instance on a different port/chain-id
  anvil-base:
    image: ${ANVIL_IMAGE:-ghcr.io/foundry-rs/foundry:latest}
    platform: linux/amd64
    container_name: chainpulse-anvil-base
    entrypoint: ["anvil"]
    ports: ["8549:8549"]
    command: ["--host","0.0.0.0","--port","8549","--chain-id","8453","--accounts","10","--balance","10000"]
    healthcheck:
      test: ["CMD","cast","rpc","--rpc-url","http://127.0.0.1:8549","eth_chainId"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      chainpulse:
        aliases: [base-rpc]

  anvil-avalanche:
    image: ${ANVIL_IMAGE:-ghcr.io/foundry-rs/foundry:latest}
    platform: linux/amd64
    container_name: chainpulse-anvil-avalanche
    entrypoint: ["anvil"]
    ports: ["8550:8550"]
    command: ["--host","0.0.0.0","--port","8550","--chain-id","43114","--accounts","10","--balance","10000"]
    healthcheck:
      test: ["CMD","cast","rpc","--rpc-url","http://127.0.0.1:8550","eth_chainId"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      chainpulse:
        aliases: [avalanche-rpc]

  anvil-bsc:
    image: ${ANVIL_IMAGE:-ghcr.io/foundry-rs/foundry:latest}
    platform: linux/amd64
    container_name: chainpulse-anvil-bsc
    entrypoint: ["anvil"]
    ports: ["8546:8546"]
    command: ["--host","0.0.0.0","--port","8546","--chain-id","56","--accounts","10","--balance","10000"]
    healthcheck:
      test: ["CMD","cast","rpc","--rpc-url","http://127.0.0.1:8546","eth_chainId"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      chainpulse:
        aliases: [bsc-rpc]

  anvil-polygon:
    image: ${ANVIL_IMAGE:-ghcr.io/foundry-rs/foundry:latest}
    platform: linux/amd64
    container_name: chainpulse-anvil-polygon
    entrypoint: ["anvil"]
    ports: ["8547:8547"]
    command: ["--host","0.0.0.0","--port","8547","--chain-id","137","--accounts","10","--balance","10000"]
    healthcheck:
      test: ["CMD","cast","rpc","--rpc-url","http://127.0.0.1:8547","eth_chainId"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      chainpulse:
        aliases: [polygon-rpc-alt]

  anvil-arbitrum:
    image: ${ANVIL_IMAGE:-ghcr.io/foundry-rs/foundry:latest}
    platform: linux/amd64
    container_name: chainpulse-anvil-arbitrum
    entrypoint: ["anvil"]
    ports: ["8548:8548"]
    command: ["--host","0.0.0.0","--port","8548","--chain-id","42161","--accounts","10","--balance","10000"]
    healthcheck:
      test: ["CMD","cast","rpc","--rpc-url","http://127.0.0.1:8548","eth_chainId"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      chainpulse:
        aliases: [arbitrum-rpc]

  mongodb:
    image: mongo:7
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      chainpulse:
        aliases:
          - mongodb

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: chainpulse-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
      - /tmp/chainpulse-sim:/tmp/chainpulse-sim:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    networks:
      - chainpulse

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.microservices
    container_name: chainpulse-ms-frontend
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "13000:3000"
    networks:
      - chainpulse
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.1.0
    container_name: chainpulse-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - chainpulse

  jaeger:
    image: jaegertracing/all-in-one:1.49
    container_name: chainpulse-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - chainpulse

  api-service:
    image: chainpulse-api-service:latest
    container_name: chainpulse-api-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      API_SERVICE_PORT: 8081
      INSTANCE_ID: api-service-1
      API_SERVICE_DB_HOST: postgres-primary
      API_SERVICE_DB_PORT: 5432
      DATABASE_URL: ${DATABASE_URL}
      MONGODB_URI: mongodb://mongodb:27017
      LOG_LEVEL: info
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - chainpulse

  api-gateway:
    image: chainpulse-api-gateway:latest
    container_name: chainpulse-api-gateway
    depends_on:
      api-service:
        condition: service_healthy
    environment:
      GATEWAY_PORT: 8080
      INSTANCE_ID: api-gateway-1
      GATEWAY_UPSTREAM_SERVICES: http://api-service:8081
      GATEWAY_AUTH_JWT_SECRET: ${JWT_SECRET:-}
      LOG_LEVEL: info
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - chainpulse

  event-processor:
    image: chainpulse-event-processor:latest
    container_name: chainpulse-event-processor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      PROCESSOR_PORT: 8082
      INSTANCE_ID: event-processor-1
      DATABASE_URL: ${DATABASE_URL}
      MONGODB_URI: mongodb://mongodb:27017
      KAFKA_BROKERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_CONSUMER_GROUP: event-processor-consumers
      KAFKA_INPUT_TOPICS: raw-events,blockchain-events
      KAFKA_OUTPUT_TOPICS: processed-events,indexed-events
      LOG_LEVEL: info
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8082/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - chainpulse

  puller:
    image: chainpulse-puller:latest
    container_name: chainpulse-puller
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      anvil:            { condition: service_healthy }
      anvil-bsc:        { condition: service_healthy }
      anvil-polygon:    { condition: service_healthy }
      anvil-arbitrum:   { condition: service_healthy }
      anvil-base:       { condition: service_healthy }
      anvil-avalanche:  { condition: service_healthy }
    environment:
      PULLER_PORT: 8083
      INSTANCE_ID: puller-1
      DATABASE_URL: ${DATABASE_URL}
      MONGODB_URI: mongodb://mongodb:27017
      KAFKA_BROKERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_PRODUCER_GROUP: data-puller-producers
      KAFKA_OUTPUT_TOPICS: raw-events,blockchain-events
      BLOCKCHAIN_RPCS: ethereum=http://chainpulse-anvil:8545,bsc=http://chainpulse-anvil-bsc:8546,polygon=http://chainpulse-anvil-polygon:8547,arbitrum=http://chainpulse-anvil-arbitrum:8548,base=http://chainpulse-anvil-base:8549,avalanche=http://chainpulse-anvil-avalanche:8550
      POLL_INTERVAL: 12
      BLOCK_CONFIRMATION: 1
      STATE_BACKEND: memory
      LOG_LEVEL: info
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8083/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - chainpulse

  simulator:
    image: ${ANVIL_IMAGE:-ghcr.io/foundry-rs/foundry:latest}
    platform: linux/amd64
    container_name: chainpulse-simulator
    depends_on:
      anvil:            { condition: service_healthy }
      anvil-bsc:        { condition: service_healthy }
      anvil-polygon:    { condition: service_healthy }
      anvil-arbitrum:   { condition: service_healthy }
      anvil-base:       { condition: service_healthy }
      anvil-avalanche:  { condition: service_healthy }
    volumes:
      - ./simulator-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    environment:
      ANVIL_RPC:          http://chainpulse-anvil:8545
      ANVIL_RPC_BSC:      http://chainpulse-anvil-bsc:8546
      ANVIL_RPC_POLYGON:  http://chainpulse-anvil-polygon:8547
      ANVIL_RPC_ARBITRUM: http://chainpulse-anvil-arbitrum:8548
      ANVIL_RPC_BASE:     http://chainpulse-anvil-base:8549
      ANVIL_RPC_AVALANCHE: http://chainpulse-anvil-avalanche:8550
      CHAINS: ethereum,bsc,polygon,arbitrum,base,avalanche
      # Traffic control
      SIM_EVENTS_MIN: 1
      SIM_EVENTS_MAX: 5
      SIM_POISSON_MEAN: 4
      SIM_REORG_CHANCE: 10
      # Burst mode
      SIM_BURST_ENABLED: "true"
      SIM_BURST_MIN_TPS: 15
      SIM_BURST_MAX_TPS: 50
      SIM_BURST_DURATION_SEC: 8
      SIM_BURST_PROBABILITY: 15
      # Edge cases
      SIM_REORG_MIN_DEPTH: 2
      SIM_REORG_MAX_DEPTH: 6
      SIM_TIMESTAMP_ANOMALY_CHANCE: 5
      SIM_DUPLICATE_CHANCE: 3
    networks:
      - chainpulse
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  anvil_svm_cache:

networks:
  chainpulse:
    driver: bridge
