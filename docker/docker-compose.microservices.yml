name: chainpulse

services:
  postgres:
    image: postgres:15-alpine
    container_name: chainpulse-postgres
    environment:
      POSTGRES_USER: chainpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: chainpulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainpulse -d chainpulse"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      chainpulse:
        aliases:
          - postgres-primary

  redis:
    image: redis:7-alpine
    container_name: chainpulse-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      chainpulse:
        aliases:
          - redis-1
          - redis-2
          - redis-3

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: chainpulse-zookeeper
    init: true
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      chainpulse:
        aliases:
          - zookeeper

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: chainpulse-kafka
    init: true
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    networks:
      chainpulse:
        aliases:
          - kafka
          - kafka-1
          - kafka-2
          - kafka-3

  anvil:
    image: ${ANVIL_IMAGE:-ghcr.io/foundry-rs/foundry:latest}
    platform: linux/amd64
    container_name: chainpulse-anvil
    restart: unless-stopped
    entrypoint: ["anvil"]
    volumes:
      - anvil_svm_cache:/root/.svm
    ports:
      - "8545:8545"
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8545"
      - "--chain-id"
      - "31337"
      - "--accounts"
      - "5"
      - "--balance"
      - "1000"
      - "--block-time"
      - "5"
    healthcheck:
      test: ["CMD", "cast", "rpc", "--rpc-url", "http://127.0.0.1:8545", "eth_chainId"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      chainpulse:
        aliases:
          - ethereum-rpc
    deploy:
      resources:
        limits:
          cpus: '0.40'
          memory: 512M

  solana-validator:
    image: ${SOLANA_VALIDATOR_IMAGE:-tchambard/solana-test-validator:latest}
    platform: linux/amd64
    container_name: chainpulse-solana
    restart: unless-stopped
    entrypoint: ["solana-test-validator"]
    ports:
      - "8899:8899"
      - "8900:8900"
    command:
      - "--bind-address=0.0.0.0"
      - "--rpc-port=8899"
      - "--faucet-sol=1000000"
      - "--reset"
    volumes:
      - solana_ledger:/root/.config/solana/test-ledger
    healthcheck:
      test: ["CMD", "solana", "cluster-version", "--url", "http://127.0.0.1:8899"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s
    networks:
      chainpulse:
        aliases: [solana-rpc]
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 1536M

  mongodb:
    image: mongo:7
    restart: unless-stopped
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand({ping:1}).ok' | mongosh --quiet mongodb://localhost:27017/test || exit 1"]
      interval: 15s
      timeout: 60s
      retries: 15
      start_period: 120s
    networks:
      chainpulse:
        aliases:
          - mongodb

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: chainpulse-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
      - /tmp/chainpulse-sim:/tmp/chainpulse-sim:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    networks:
      - chainpulse

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.microservices
    container_name: chainpulse-ms-frontend
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "13000:3000"
    networks:
      - chainpulse
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.1.0
    container_name: chainpulse-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - chainpulse

  jaeger:
    image: jaegertracing/all-in-one:1.49
    container_name: chainpulse-jaeger
    ports:
      - "16687:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - chainpulse

  api-service:
    image: chainpulse-api-service:latest
    container_name: chainpulse-api-service
    restart: on-failure:3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      GOMAXPROCS: "1"
      API_SERVICE_PORT: 8081
      INSTANCE_ID: api-service-1
      API_SERVICE_DB_HOST: postgres
      API_SERVICE_DB_PORT: 5432
      DATABASE_URL: ${DATABASE_URL}
      MONGODB_URI: mongodb://mongodb:27017
      LOG_LEVEL: info
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8081 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - chainpulse

  api-gateway:
    image: chainpulse-api-gateway:latest
    container_name: chainpulse-api-gateway
    depends_on:
      api-service:
        condition: service_started
    environment:
      GOMAXPROCS: "1"
      GATEWAY_PORT: 8080
      INSTANCE_ID: api-gateway-1
      GATEWAY_UPSTREAM_SERVICES: http://api-service:8081
      GATEWAY_AUTH_JWT_SECRET: ${JWT_SECRET:-}
      LOG_LEVEL: info
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - chainpulse

  event-processor:
    image: chainpulse-event-processor:latest
    container_name: chainpulse-event-processor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      GOMAXPROCS: "1"
      PROCESSOR_PORT: 8082
      INSTANCE_ID: event-processor-1
      DATABASE_URL: ${DATABASE_URL}
      MONGODB_URI: mongodb://mongodb:27017
      KAFKA_BROKERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_CONSUMER_GROUP: event-processor-consumers-v9
      KAFKA_INPUT_TOPICS: raw-events,blockchain-events
      KAFKA_OUTPUT_TOPICS: processed-events,indexed-events
      LOG_LEVEL: info
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8082 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - chainpulse

  puller:
    image: chainpulse-puller:latest
    container_name: chainpulse-puller
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      anvil:            { condition: service_healthy }
      solana-validator: { condition: service_healthy }
    environment:
      GOMAXPROCS: "1"
      PULLER_PORT: 8083
      INSTANCE_ID: puller-1
      DATABASE_URL: ${DATABASE_URL}
      MONGODB_URI: mongodb://mongodb:27017
      KAFKA_BROKERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_PRODUCER_GROUP: data-puller-producers
      KAFKA_OUTPUT_TOPICS: raw-events,blockchain-events
      BLOCKCHAIN_RPCS: ethereum=http://chainpulse-anvil:8545,bsc=http://chainpulse-anvil:8545,polygon=http://chainpulse-anvil:8545,arbitrum=http://chainpulse-anvil:8545,base=http://chainpulse-anvil:8545,avalanche=http://chainpulse-anvil:8545,solana=http://chainpulse-solana:8899
      POLL_INTERVAL: 12
      BLOCK_CONFIRMATION: 1
      STATE_BACKEND: memory
      LOG_LEVEL: info
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8083 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - chainpulse
volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  anvil_svm_cache:
  solana_ledger:
  mongodb_data:

networks:
  chainpulse:
    driver: bridge
