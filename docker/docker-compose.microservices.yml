name: chainpulse

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: postgres:15-alpine
    <<: *default-logging
    container_name: chainpulse-postgres
    command:
      - "postgres"
      - "-c"
      - "max_connections=20"
      - "-c"
      - "shared_buffers=64MB"
      - "-c"
      - "effective_cache_size=256MB"
      - "-c"
      - "synchronous_commit=off"
      - "-c"
      - "wal_level=minimal"
      - "-c"
      - "full_page_writes=off"
      - "-c"
      - "commit_delay=100000"
      - "-c"
      - "bgwriter_delay=500ms"
      - "-c"
      - "bgwriter_lru_maxpages=20"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "max_wal_size=256MB"
      - "-c"
      - "min_wal_size=32MB"
      - "-c"
      - "max_wal_senders=0"
      - "-c"
      - "max_replication_slots=0"
      - "-c"
      - "autovacuum=off"
    environment:
      POSTGRES_USER: chainpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: chainpulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainpulse -d chainpulse"]
      interval: 60s
      timeout: 5s
      retries: 3
    networks:
      chainpulse:
        aliases:
          - postgres-primary
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 256M

  redis:
    image: redis:7-alpine
    <<: *default-logging
    container_name: chainpulse-redis
    ports:
      - "6379:6379"
    command: redis-server --save "" --hz 5 --dynamic-hz no --lazyfree-lazy-eviction yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 60s
      timeout: 5s
      retries: 3
    networks:
      chainpulse:
        aliases:
          - redis-1
          - redis-2
          - redis-3
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 128M

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    <<: *default-logging
    container_name: chainpulse-zookeeper
    init: true
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 3000
      ZOOKEEPER_HEAP_OPTS: "-Xms128M -Xmx256M"
      ZOOKEEPER_MAX_CLIENT_CNXNS: 30
      ZOOKEEPER_SNAP_COUNT: "500000"
      ZOOKEEPER_PURGE_INTERVAL: "24"
      ZOOKEEPER_AUTOPURGE_SNAP_RETAIN_COUNT: "5"
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 256M
    networks:
      chainpulse:
        aliases:
          - zookeeper

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    <<: *default-logging
    container_name: chainpulse-kafka
    init: true
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xms128M -Xmx256M"
      KAFKA_NUM_NETWORK_THREADS: "1"
      KAFKA_NUM_IO_THREADS: "1"
      KAFKA_BACKGROUND_THREADS: "1"
      KAFKA_LOG_CLEANER_THREADS: "1"
      KAFKA_LOG_CLEANER_DEDUPE_BUFFER_SIZE: "67108864"
      KAFKA_LOG_CLEANER_BACKOFF_MS: "600000"
      KAFKA_LOG_FLUSH_INTERVAL_MS: "600000"
      KAFKA_COMPRESSION_TYPE: "producer"
      KAFKA_LOG_RETENTION_HOURS: "2"
      KAFKA_LOG_RETENTION_BYTES: "107374182"
      KAFKA_LOG_SEGMENT_BYTES: "53687091"
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_NUM_PARTITIONS: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      chainpulse:
        aliases:
          - kafka
          - kafka-1
          - kafka-2
          - kafka-3
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 1G

  anvil:
    image: ${ANVIL_IMAGE:-ghcr.io/foundry-rs/foundry:latest}
    <<: *default-logging
    platform: linux/amd64
    container_name: chainpulse-anvil
    restart: unless-stopped
    entrypoint: ["anvil"]
    volumes:
      - anvil_svm_cache:/root/.svm
    ports:
      - "8545:8545"
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8545"
      - "--chain-id"
      - "31337"
      - "--accounts"
      - "5"
      - "--balance"
      - "1000"
      - "--block-time"
      - "12"
    healthcheck:
      test: ["CMD", "cast", "rpc", "--rpc-url", "http://127.0.0.1:8545", "eth_chainId"]
      interval: 60s
      timeout: 5s
      retries: 5
    networks:
      chainpulse:
        aliases:
          - ethereum-rpc
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 256M

  solana-validator:
    image: ${SOLANA_VALIDATOR_IMAGE:-tchambard/solana-test-validator:latest}
    <<: *default-logging
    platform: linux/amd64
    container_name: chainpulse-solana
    restart: unless-stopped
    entrypoint: ["solana-test-validator"]
    ports:
      - "8899:8899"
      - "8900:8900"
    command:
      - "--bind-address=0.0.0.0"
      - "--rpc-port=8899"
      - "--faucet-sol=1000000"
      - "--reset"
      - "--ticks-per-slot=8"
      - "--limit-ledger-size=1000"
      - "--slots-per-epoch=32"

    volumes:
      - solana_ledger:/root/.config/solana/test-ledger
    healthcheck:
      test: ["CMD", "solana", "cluster-version", "--url", "http://127.0.0.1:8899"]
      interval: 120s
      timeout: 60s
      retries: 3
      start_period: 240s
    networks:
      chainpulse:
        aliases: [solana-rpc]
    deploy:
      resources:
        limits:
          cpus: '0.02'
          memory: 1536M

  mongodb:
    image: mongo:7
    <<: *default-logging
    restart: unless-stopped
    command:
      - "--wiredTigerCacheSizeGB"
      - "0.25"
      - "--setParameter"
      - "diagnosticDataCollectionEnabled=false"
      - "--wiredTigerJournalCompressor"
      - "none"
      - "--setParameter"
      - "storageEngineConcurrentReadTransactions=8"
      - "--setParameter"
      - "storageEngineConcurrentWriteTransactions=5"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand({ping:1}).ok' | mongosh --quiet mongodb://localhost:27017/test || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 60s
    networks:
      chainpulse:
        aliases:
          - mongodb
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 1G

  prometheus:
    image: prom/prometheus:v2.47.0
    <<: *default-logging
    container_name: chainpulse-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
      - alertmanager_data:/alertmanager
      - /tmp/chainpulse-sim:/tmp/chainpulse-sim:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      - "--storage.tsdb.retention.time=7d"
      - "--storage.tsdb.min-block-duration=2h"
    networks:
      - chainpulse
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 256M

  alertmanager:
    image: prom/alertmanager:v0.26.0
    <<: *default-logging
    container_name: chainpulse-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ../monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--log.level=debug"
    networks:
      - chainpulse
    deploy:
      resources:
        limits:
          cpus: '0.05'
          memory: 64M

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.microservices
    <<: *default-logging
    container_name: chainpulse-ms-frontend
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "13000:3000"
    networks:
      - chainpulse
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 256M

  grafana:
    image: grafana/grafana:10.1.0
    <<: *default-logging
    container_name: chainpulse-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ALERTING_ENABLED: "false"
      GF_UNIFIED_ALERTING_ENABLED: "false"
      GF_LIVE_MAX_CHANNELS: "5"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: "5m"
    volumes:
      - ../monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - chainpulse
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 256M

  jaeger:
    image: jaegertracing/all-in-one:1.49
    <<: *default-logging
    container_name: chainpulse-jaeger
    ports:
      - "16687:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - chainpulse
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 256M
    depends_on:
      prometheus:
        condition: service_started

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    <<: *default-logging
    container_name: chainpulse-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://chainpulse:${POSTGRES_PASSWORD}@postgres:5432/chainpulse?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - chainpulse
    deploy:
      resources:
        limits:
          cpus: '0.05'
          memory: 32M

  redis-exporter:
    image: oliver006/redis_exporter:v1.61.0
    <<: *default-logging
    container_name: chainpulse-redis-exporter
    environment:
      REDIS_ADDR: "redis:6379"
    ports:
      - "9121:9121"
    networks:
      - chainpulse
    deploy:
      resources:
        limits:
          cpus: '0.05'
          memory: 32M

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    <<: *default-logging
    container_name: chainpulse-kafka-exporter
    environment:
      KAFKA_EXPORTER_KAFKA_SERVERS: "kafka:9092"
    ports:
      - "9308:9308"
    networks:
      - chainpulse
    deploy:
      resources:
        limits:
          cpus: '0.05'
          memory: 64M

  api-service:
    image: chainpulse-api-service:latest
    <<: *default-logging
    container_name: chainpulse-api-service
    restart: on-failure:3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 256M
    environment:
      GOMAXPROCS: "1"
      GOMEMLIMIT: "200MiB"
      GOGC: "200"
      API_SERVICE_PORT: 8081
      INSTANCE_ID: api-service-1
      API_SERVICE_DB_HOST: postgres
      API_SERVICE_DB_PORT: 5432
      DATABASE_URL: ${DATABASE_URL}
      MONGODB_URI: mongodb://mongodb:27017
      LOG_LEVEL: error
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8081 || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - chainpulse

  api-gateway:
    image: chainpulse-api-gateway:latest
    <<: *default-logging
    container_name: chainpulse-api-gateway
    depends_on:
      api-service:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 128M
    environment:
      GOMAXPROCS: "1"
      GOMEMLIMIT: "100MiB"
      GOGC: "200"
      GATEWAY_PORT: 8080
      INSTANCE_ID: api-gateway-1
      GATEWAY_UPSTREAM_SERVICES: http://api-service:8081
      GATEWAY_AUTH_JWT_SECRET: ${JWT_SECRET:-}
      LOG_LEVEL: error
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080 || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - chainpulse

  event-processor:
    image: chainpulse-event-processor:latest
    <<: *default-logging
    container_name: chainpulse-event-processor
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 256M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      GOMAXPROCS: "1"
      GOMEMLIMIT: "200MiB"
      GOGC: "200"
      PROCESSOR_PORT: 8082
      INSTANCE_ID: event-processor-1
      DATABASE_URL: ${DATABASE_URL}
      MONGODB_URI: mongodb://mongodb:27017
      KAFKA_BROKERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_CONSUMER_GROUP: event-processor-consumers-v9
      KAFKA_INPUT_TOPICS: raw-events,blockchain-events
      KAFKA_OUTPUT_TOPICS: processed-events,indexed-events
      LOG_LEVEL: error
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8082 || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - chainpulse

  puller:
    image: chainpulse-puller:latest
    <<: *default-logging
    container_name: chainpulse-puller
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 256M
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      anvil:            { condition: service_healthy }
      solana-validator: { condition: service_healthy }
    environment:
      GOMAXPROCS: "1"
      GOMEMLIMIT: "200MiB"
      GOGC: "200"
      PULLER_PORT: 8083
      INSTANCE_ID: puller-1
      DATABASE_URL: ${DATABASE_URL}
      MONGODB_URI: mongodb://mongodb:27017
      KAFKA_BROKERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_PRODUCER_GROUP: data-puller-producers
      KAFKA_OUTPUT_TOPICS: raw-events,blockchain-events
      BLOCKCHAIN_RPCS: ethereum=http://chainpulse-anvil:8545,bsc=http://chainpulse-anvil:8545,polygon=http://chainpulse-anvil:8545,arbitrum=http://chainpulse-anvil:8545,base=http://chainpulse-anvil:8545,avalanche=http://chainpulse-anvil:8545,solana=http://chainpulse-solana:8899
      POLL_INTERVAL: 30
      BLOCK_CONFIRMATION: 1
      STATE_BACKEND: memory
      LOG_LEVEL: error
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8083 || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - chainpulse
volumes:
  postgres_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  anvil_svm_cache:
  solana_ledger:
  mongodb_data:

networks:
  chainpulse:
    driver: bridge
