services:
  # ============================================
  # Blockchain Nodes (Anvil) - 7 Chains Supported
  # ============================================

  # Ethereum (Chain ID: 1)
  anvil-ethereum:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: chainpulse-anvil-ethereum
    ports:
      - "8545:8545"
    command: anvil --host 0.0.0.0 --port 8545 --chain-id 1 --accounts 10 --balance 10000 --timestamp 0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8545"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chainpulse-network

  # Polygon (Chain ID: 137)
  anvil-polygon:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: chainpulse-anvil-polygon
    ports:
      - "8546:8545"
    command: anvil --host 0.0.0.0 --port 8545 --chain-id 137 --accounts 10 --balance 10000 --timestamp 0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8545"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chainpulse-network

  # BSC (Chain ID: 97)
  anvil-bsc:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: chainpulse-anvil-bsc
    ports:
      - "8547:8545"
    command: anvil --host 0.0.0.0 --port 8545 --chain-id 97 --accounts 10 --balance 10000 --timestamp 0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8545"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chainpulse-network

  # Arbitrum (Chain ID: 421614 - Sepolia testnet)
  anvil-arbitrum:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: chainpulse-anvil-arbitrum
    ports:
      - "8548:8545"
    command: anvil --host 0.0.0.0 --port 8545 --chain-id 421614 --accounts 10 --balance 10000 --timestamp 0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8545"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chainpulse-network

  # Optimism (Chain ID: 11155420 - Sepolia testnet)
  anvil-optimism:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: chainpulse-anvil-optimism
    ports:
      - "8549:8545"
    command: anvil --host 0.0.0.0 --port 8545 --chain-id 11155420 --accounts 10 --balance 10000 --timestamp 0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8545"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chainpulse-network

  # Base (Chain ID: 84532 - Sepolia testnet)
  anvil-base:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: chainpulse-anvil-base
    ports:
      - "8550:8545"
    command: anvil --host 0.0.0.0 --port 8545 --chain-id 84532 --accounts 10 --balance 10000 --timestamp 0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8545"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chainpulse-network

  # Avalanche (Chain ID: 43113 - Fuji testnet)
  anvil-avalanche:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: chainpulse-anvil-avalanche
    ports:
      - "8551:8545"
    command: anvil --host 0.0.0.0 --port 8545 --chain-id 43113 --accounts 10 --balance 10000 --timestamp 0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8545"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chainpulse-network

  # ============================================
  # Infrastructure Services
  # ============================================

  postgres:
    image: postgres:15-alpine
    container_name: chainpulse-postgres
    environment:
      POSTGRES_USER: chainpulse
      POSTGRES_PASSWORD: chainpulse_password
      POSTGRES_DB: chainpulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainpulse"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chainpulse-network

  redis:
    image: redis:7-alpine
    container_name: chainpulse-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chainpulse-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: chainpulse-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chainpulse-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: chainpulse-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chainpulse-network

  chainpulse:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: chainpulse-app
    depends_on:
      anvil-ethereum:
        condition: service_healthy
      anvil-polygon:
        condition: service_healthy
      anvil-bsc:
        condition: service_healthy
      anvil-arbitrum:
        condition: service_healthy
      anvil-optimism:
        condition: service_healthy
      anvil-base:
        condition: service_healthy
      anvil-avalanche:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      CHAINPULSE_CHAINS: ethereum,polygon,bsc,arbitrum,optimism,base,avalanche
      CHAINPULSE_ETHEREUM_NODE_URL: http://anvil-ethereum:8545
      CHAINPULSE_ETHEREUM_CHAIN_ID: 1
      CHAINPULSE_POLYGON_NODE_URL: http://anvil-polygon:8545
      CHAINPULSE_POLYGON_CHAIN_ID: 137
      CHAINPULSE_BSC_NODE_URL: http://anvil-bsc:8545
      CHAINPULSE_BSC_CHAIN_ID: 97
      CHAINPULSE_ARBITRUM_NODE_URL: http://anvil-arbitrum:8545
      CHAINPULSE_ARBITRUM_CHAIN_ID: 421614
      CHAINPULSE_OPTIMISM_NODE_URL: http://anvil-optimism:8545
      CHAINPULSE_OPTIMISM_CHAIN_ID: 11155420
      CHAINPULSE_BASE_NODE_URL: http://anvil-base:8545
      CHAINPULSE_BASE_CHAIN_ID: 84532
      CHAINPULSE_AVALANCHE_NODE_URL: http://anvil-avalanche:8545
      CHAINPULSE_AVALANCHE_CHAIN_ID: 43113
      CHAINPULSE_LOG_LEVEL: INFO
      CHAINPULSE_DEPLOYMENT_MODE: monolithic
      CHAINPULSE_API_PORT: 8080
      CHAINPULSE_GRPC_PORT: 50051
      CHAINPULSE_METRICS_PORT: 8081
      CHAINPULSE_DATA_PULLER_TYPE: https_jsonrpc
      CHAINPULSE_PULLER_POLL_INTERVAL_MS: 1000
      CHAINPULSE_CACHE_TYPE: redis
      CHAINPULSE_CACHE_TTL_SECONDS: 3600
      CHAINPULSE_DATABASE_TYPE: postgres
      CHAINPULSE_DATABASE_URL: postgres://chainpulse:chainpulse_password@postgres:5432/chainpulse
      CHAINPULSE_MQ_TYPE: kafka
      CHAINPULSE_MQ_BROKERS: kafka:29092
    ports:
      - "8080:8080"
      - "50051:50051"
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - chainpulse-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  chainpulse-network:
    driver: bridge
