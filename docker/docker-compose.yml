services:
  # ============================================
  # Blockchain Nodes (Anvil) - 7 Chains Supported
  # ============================================

  # Ethereum (Chain ID: 1)
  anvil-ethereum:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: chainpulse-anvil-ethereum
    entrypoint: ["anvil", "--host", "0.0.0.0", "--port", "8545", "--chain-id", "1", "--accounts", "10", "--balance", "10000", "--timestamp", "0"]
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD-SHELL", "cast chain --rpc-url http://localhost:8545 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - chainpulse-network

  # Polygon (Chain ID: 137)
  anvil-polygon:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: chainpulse-anvil-polygon
    entrypoint: ["anvil", "--host", "0.0.0.0", "--port", "8545", "--chain-id", "137", "--accounts", "10", "--balance", "10000", "--timestamp", "0"]
    ports:
      - "8546:8545"
    healthcheck:
      test: ["CMD-SHELL", "cast chain --rpc-url http://localhost:8545 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - chainpulse-network

  # BSC (Chain ID: 97)
  anvil-bsc:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: chainpulse-anvil-bsc
    entrypoint: ["anvil", "--host", "0.0.0.0", "--port", "8545", "--chain-id", "97", "--accounts", "10", "--balance", "10000", "--timestamp", "0"]
    ports:
      - "8547:8545"
    healthcheck:
      test: ["CMD-SHELL", "cast chain --rpc-url http://localhost:8545 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - chainpulse-network

  # Arbitrum (Chain ID: 421614 - Sepolia testnet)
  anvil-arbitrum:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: chainpulse-anvil-arbitrum
    entrypoint: ["anvil", "--host", "0.0.0.0", "--port", "8545", "--chain-id", "421614", "--accounts", "10", "--balance", "10000", "--timestamp", "0"]
    ports:
      - "8548:8545"
    healthcheck:
      test: ["CMD-SHELL", "cast chain --rpc-url http://localhost:8545 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - chainpulse-network

  # Optimism (Chain ID: 11155420 - Sepolia testnet)
  anvil-optimism:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: chainpulse-anvil-optimism
    entrypoint: ["anvil", "--host", "0.0.0.0", "--port", "8545", "--chain-id", "11155420", "--accounts", "10", "--balance", "10000", "--timestamp", "0"]
    ports:
      - "8549:8545"
    healthcheck:
      test: ["CMD-SHELL", "cast chain --rpc-url http://localhost:8545 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - chainpulse-network

  # Base (Chain ID: 84532 - Sepolia testnet)
  anvil-base:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: chainpulse-anvil-base
    entrypoint: ["anvil", "--host", "0.0.0.0", "--port", "8545", "--chain-id", "84532", "--accounts", "10", "--balance", "10000", "--timestamp", "0"]
    ports:
      - "8550:8545"
    healthcheck:
      test: ["CMD-SHELL", "cast chain --rpc-url http://localhost:8545 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - chainpulse-network

  # Avalanche (Chain ID: 43113 - Fuji testnet)
  anvil-avalanche:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: chainpulse-anvil-avalanche
    entrypoint: ["anvil", "--host", "0.0.0.0", "--port", "8545", "--chain-id", "43113", "--accounts", "10", "--balance", "10000", "--timestamp", "0"]
    ports:
      - "8551:8545"
    healthcheck:
      test: ["CMD-SHELL", "cast chain --rpc-url http://localhost:8545 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - chainpulse-network

  # ============================================
  # Infrastructure Services
  # ============================================

  postgres:
    image: postgres:15-alpine
    container_name: chainpulse-postgres
    environment:
      POSTGRES_USER: chainpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: chainpulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainpulse"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chainpulse-network

  redis:
    image: redis:7-alpine
    container_name: chainpulse-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chainpulse-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: chainpulse-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - chainpulse-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: chainpulse-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 | grep -q Mode"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - chainpulse-network

  mongodb:
    image: mongo:7
    container_name: chainpulse-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - chainpulse-network

  chainpulse:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prebuilt
    container_name: chainpulse-app
    depends_on:
      anvil-ethereum:
        condition: service_healthy
      anvil-polygon:
        condition: service_healthy
      anvil-bsc:
        condition: service_healthy
      anvil-arbitrum:
        condition: service_healthy
      anvil-optimism:
        condition: service_healthy
      anvil-base:
        condition: service_healthy
      anvil-avalanche:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      CHAINS: ethereum,polygon,bsc,arbitrum,optimism,base,avalanche
      BLOCKCHAIN_NODE_URLS: http://anvil-ethereum:8545,http://anvil-polygon:8545,http://anvil-bsc:8545,http://anvil-arbitrum:8545,http://anvil-optimism:8545,http://anvil-base:8545,http://anvil-avalanche:8545
      DATA_PULLER_TYPE: https-jsonrpc
      DEPLOYMENT_MODE: monolithic
      LOG_LEVEL: info
      API_PORT: "8080"
      WORKER_POOL_SIZE: "8"
      BATCH_SIZE: "100"
      CACHE_TYPE: redis
      CACHE_CONNECTION_URL: redis://redis:6379
      DATABASE_TYPE: postgres
      DATABASE_URL: ${DATABASE_URL}
      MONGODB_URI: mongodb://mongodb:27017
      MQ_TYPE: kafka
      MQ_CONNECTION_URL: kafka:29092
      MONOLITHIC_DLQ_RETENTION: 168h
    ports:
      - "8080:8080"
      - "50051:50051"
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 10
    networks:
      - chainpulse-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  mongodb_data:

networks:
  chainpulse-network:
    driver: bridge
