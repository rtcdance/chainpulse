server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API reverse proxy - route to API Gateway (entry point)
    location /events {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /metrics {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
    }

    location /runtime {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
    }

    location /models {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
    }

    # GraphQL
    location /graphql {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket
    location /ws {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Service proxies - microservices mode: each route to its own service
    # Monolithic mode uses api-gateway network alias
    location /__proxy/api-gateway/ {
        proxy_pass http://api-gateway:8080/;
        proxy_set_header Host $host;
    }

    location /__proxy/api-service/ {
        proxy_pass http://api-gateway:8080/;
        proxy_set_header Host $host;
    }

    location /__proxy/event-processor/ {
        proxy_pass http://api-gateway:8080/;
        proxy_set_header Host $host;
    }

    location /__proxy/puller/ {
        proxy_pass http://api-gateway:8080/;
        proxy_set_header Host $host;
    }

    location /__ws/api-gateway/ {
        proxy_pass http://api-gateway:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
