server {
    listen 3000;
    server_name _;

    # Docker DNS resolver for runtime hostname resolution
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Upstream variables for dynamic DNS resolution (avoids stale IP caching on container restart)
    set $api_gateway "api-gateway:8080";
    set $api_service "api-service:8081";
    set $event_processor "event-processor:8082";
    set $puller "puller:8083";

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Event stats - proxied via API gateway
    location /events/stats {
        proxy_pass http://$api_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Auth API
    location /auth {
        proxy_pass http://$api_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket subscription endpoint (must be before /events catch-all, longest prefix wins)
    location /events/subscribe {
        proxy_pass http://$api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API reverse proxy - route to API Gateway (entry point)
    location /events {
        proxy_pass http://$api_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://$api_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health {
        proxy_pass http://$api_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /metrics {
        proxy_pass http://$api_gateway;
        proxy_set_header Host $host;
    }

    location /runtime {
        proxy_pass http://$api_gateway;
        proxy_set_header Host $host;
    }

    location /models {
        proxy_pass http://$api_gateway;
        proxy_set_header Host $host;
    }

    # GraphQL
    location /graphql {
        proxy_pass http://$api_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket
    location /ws {
        proxy_pass http://$api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Service proxies - microservices mode: each route to its own service
    # With variable-based proxy_pass, nginx does NOT auto-strip the location prefix,
    # so we must use rewrite to remove the /__proxy/<service>/ prefix.
    location /__proxy/api-gateway/ {
        rewrite ^/__proxy/api-gateway/(.*)$ /$1 break;
        proxy_pass http://$api_gateway;
        proxy_set_header Host $host;
    }

    location /__proxy/api-service/ {
        rewrite ^/__proxy/api-service/(.*)$ /$1 break;
        proxy_pass http://$api_service;
        proxy_set_header Host $host;
    }

    location /__proxy/event-processor/ {
        rewrite ^/__proxy/event-processor/(.*)$ /$1 break;
        proxy_pass http://$event_processor;
        proxy_set_header Host $host;
    }

    location /__proxy/puller/ {
        rewrite ^/__proxy/puller/(.*)$ /$1 break;
        proxy_pass http://$puller;
        proxy_set_header Host $host;
    }

    location /__ws/api-gateway/ {
        rewrite ^/__ws/api-gateway(/.*)$ $1 break;
        proxy_pass http://$api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
