apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: chainpulse-pdb
  namespace: chainpulse
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: chainpulse
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: postgres-pdb
  namespace: chainpulse
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: postgres
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-pdb
  namespace: chainpulse
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: redis
