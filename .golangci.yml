run:
  timeout: 5m
  concurrency: 4

# Match CI golangci-lint v1.64.8 default linters
version: 2

linters:
  enable:
    - errcheck
    - govet
    - gosec
    - revive
    - unused
    - staticcheck
    - funlen
    - wsl
    - nestif
    - nlreturn
    - godot
    - prealloc
    - ineffassign
    - gocyclo

  settings:
    gosec:
      excludes:
        - G104
        - G307
    revive:
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
    wsl:
      force-first-case: true
    funlen:
      lines: 80
      statements: 60
    gocyclo:
      min-complexity: 15

issues:
  exclude-dirs:
    - vendor
    - test/fixtures
    - docs
    - k8s
    - scripts