run:
  timeout: 5m
  concurrency: 4

version: 2

issues:
  exclude-dirs:
    - vendor
    - test/fixtures
    - docs
    - k8s
    - scripts
    - test/e2e
    - test/integration
    - test/performance
    - test/contracts

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - revive
    - gosec

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    gosec:
      excludes:
        - G104
        - G307
    revive:
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
        - name: unused-parameter
        - name: context-as-argument
        - name: redefines-builtin-id