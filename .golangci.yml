run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign

  settings:
    errcheck:
      check-type-assertions: true
    govet:
      disable:
        - fieldalignment
        - unusedwrite

  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - errcheck
      - path: test/
        linters:
          - errcheck
      - path: cmd/playground/
        linters:
          - errcheck

issues:
  max-issues-per-linter: 50
  max-same-issues: 5
