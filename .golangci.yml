run:
  timeout: 5m
  concurrency: 4

version: 2

issues:
  exclude-dirs:
    - vendor
    - test/fixtures
    - docs
    - k8s
    - scripts

  exclude-rules:
    - path: "_test\\.go"
      linters:
        - errcheck
        - revive
        - gosec
    - path: "test/e2e"
      linters:
        - all
    - path: "test/integration"
      linters:
        - all
    - path: "test/performance"
      linters:
        - all
    - path: "test/contracts"
      linters:
        - all

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - revive
    - gosec

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    gosec:
      excludes:
        - G104
        - G307
    revive:
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers