groups:
  - name: chainpulse_alerts
    interval: 30s
    rules:
      - alert: LowIndexerThroughput
        expr: sum by (chain_id) (rate(chainpulse_event_processor_event_processed[5m])) < 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Indexer throughput is low for chain {{ $labels.chain_id }}"
          description: "Processed event throughput for chain {{ $labels.chain_id }} is below 1 event/s"

      - alert: HighEventFailureRate
        expr: sum by (chain_id) (rate(chainpulse_event_processor_validation_failed[5m])) + sum by (chain_id) (rate(chainpulse_event_processor_hash_generation_failed[5m])) + sum by (chain_id) (rate(chainpulse_event_processor_storage_failed[5m])) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High event failure rate for chain {{ $labels.chain_id }}"
          description: "Event failure rate for chain {{ $labels.chain_id }} is {{ $value }} per second"

      - alert: ReorgDetected
        expr: increase(chainpulse_reorg_detected[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Blockchain reorg detected for chain {{ $labels.chain_id }}"
          description: "{{ $value }} reorgs detected for chain {{ $labels.chain_id }} in last 5 minutes"

      - alert: HighDLQDepth
        expr: chainpulse_mq_dead_letter_queue_size{chain_id="global"} > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "DLQ depth is high"
          description: "DLQ has {{ $value }} messages"

      - alert: ConsistencyMismatch
        expr: increase(chainpulse_consistency_checks_failed[10m]) > 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Data consistency issues detected for chain {{ $labels.chain_id }}"
          description: "{{ $value }} consistency mismatches for chain {{ $labels.chain_id }} in last 10 minutes"

      - alert: ServiceDown
        expr: up{job=~"chainpulse.*"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "ChainPulse service is down"
          description: "{{ $labels.job }} has been down for more than 2 minutes"

      - alert: HighMemoryUsage
        expr: go_memstats_sys_bytes{job=~"chainpulse.*"} > 2e9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "{{ $labels.job }} is using {{ $value | humanize }}B of memory"

      - alert: SlowQueryLatency
        expr: histogram_quantile(0.95, sum by (chain_id, le) (rate(chainpulse_query_cache_hit_time_ms_bucket[5m]))) > 200
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow query performance for chain {{ $labels.chain_id }}"
          description: "95th percentile query cache latency for chain {{ $labels.chain_id }} is {{ $value }}ms"

      - alert: HighGoroutineCount
        expr: go_goroutines{job=~"chainpulse.*"} > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High goroutine count"
          description: "{{ $labels.job }} has {{ $value }} goroutines, possible leak"

      - alert: DBPoolSaturation
        expr: chainpulse_db_pool_in_use / chainpulse_db_pool_max_open_connections > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Database connection pool near saturation"
          description: "DB pool is {{ $value | humanizePercentage }} utilized"

      - alert: RPCErrorRate
        expr: sum by (chain_id) (rate(chainpulse_rpc_call_errors_total[5m])) / sum by (chain_id) (rate(chainpulse_rpc_call_duration_seconds_count[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High RPC error rate for chain {{ $labels.chain_id }}"
          description: "RPC error rate for chain {{ $labels.chain_id }} is {{ $value | humanizePercentage }}"
