global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'chainpulse'
    environment: 'production'

scrape_configs:
  # Monolithic deployment - current running instance
  - job_name: 'chainpulse-monolithic'
    static_configs:
      - targets: ['host.docker.internal:8080']
    metrics_path: '/metrics'

  # Microservices - update ports to match actual service ports
  - job_name: 'chainpulse-puller'
    static_configs:
      - targets: ['chainpulse-puller:8083']
    metrics_path: '/metrics'

  - job_name: 'chainpulse-event-processor'
    static_configs:
      - targets: ['chainpulse-event-processor:8082']
    metrics_path: '/metrics'

  - job_name: 'chainpulse-api-gateway'
    static_configs:
      - targets: ['chainpulse-api-gateway:8080']
    metrics_path: '/metrics'

  - job_name: 'chainpulse-api-service'
    static_configs:
      - targets: ['chainpulse-api-service:8081']
    metrics_path: '/metrics'

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka-exporter:9308']

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - '/etc/prometheus/alerts/*.yml'
