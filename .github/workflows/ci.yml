name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.24']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: |
          output=$(gofmt -l .)
          if [ -n "$output" ]; then
            echo "Files not formatted:"
            echo "$output"
            exit 1
          fi

      - name: Test (short, with race detector)
        run: go test -race -short -timeout 120s ./...

      - name: Build monolithic
        run: go build ./cmd/monolithic/chainpulse/

      - name: Build microservices
        run: |
          go build ./cmd/microservices/api-service/
          go build ./cmd/microservices/api-gateway/
          go build ./cmd/microservices/event-processor/
          go build ./cmd/microservices/puller/

      - name: Docker build (monolithic)
        run: docker build -f docker/Dockerfile -t chainpulse:ci .

      - name: Security scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... || true
