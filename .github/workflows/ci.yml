name: CI

on:
  push:
    branches: [main, codex/acceptance-wrapup-2026-04-09]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Fix Go 1.25 module resolution
        run: go env -w GOFLAGS="" GONOSUMCHECK="*"

      - name: Debug Go env
        run: |
          echo "GOROOT=$(go env GOROOT)"
          echo "GOPATH=$(go env GOPATH)"
          echo "GOFLAGS=$(go env GOFLAGS)"
          echo "GOEXPERIMENT=$(go env GOEXPERIMENT)"
          go env GONOSUMCHECK
          echo "--- checking GOROOT for chainpulse ---"
          ls /opt/hostedtoolcache/go/1.25.0/x64/src/ 2>/dev/null | grep -i chain || echo "no chainpulse dir in GOROOT src"

      - name: Vet
        run: |
          rm -f go.work go.work.sum
          go vet ./...

      - name: Format check
        run: |
          output=$(gofmt -l .)
          if [ -n "$output" ]; then
            echo "Files not formatted:"
            echo "$output"
            exit 1
          fi

      - name: Test (short, with race detector)
        run: go test -race -short -timeout 120s ./...

      - name: Build monolithic
        run: go build ./cmd/monolithic/chainpulse/

      - name: Build microservices
        run: |
          go build ./cmd/microservices/api-service/
          go build ./cmd/microservices/api-gateway/
          go build ./cmd/microservices/event-processor/
          go build ./cmd/microservices/puller/

      - name: Docker build (monolithic)
        run: docker build -f docker/Dockerfile -t chainpulse:ci .

      - name: Security scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... || true
