name: Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  GOPROXY: https://goproxy.cn,direct
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    name: Verify Production Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: chainpulse
          POSTGRES_PASSWORD: chainpulse_test
          POSTGRES_DB: chainpulse_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      
      - name: Install dependencies
        run: go mod download
      
      - name: Run verification script
        id: readiness
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: chainpulse
          POSTGRES_PASSWORD: chainpulse_test
          POSTGRES_DB: chainpulse_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          set -euo pipefail
          script=./scripts/verify-production-readiness.sh
          if [ ! -f "$script" ]; then
            echo "::error::$script does not exist. A readiness gate that cannot find its script must fail, not skip: the previous version printed a warning and exited 0, so this step never verified anything."
            exit 1
          fi
          chmod +x "$script"
          "$script"
      
      - name: Run all tests
        id: tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: chainpulse
          POSTGRES_PASSWORD: chainpulse_test
          POSTGRES_DB: chainpulse_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          set -euo pipefail
          go test -race -timeout 20m ./...
      
      - name: Check code quality
        id: lint
        run: |
          set -euo pipefail
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          make lint
      
      - name: Verify documentation
        id: docs
        run: |
          set -euo pipefail
          # Check required documentation files
          required_docs=(
            "docs/e2e-testing/README.md"
            "docs/e2e-testing/architecture.md"
            "docs/e2e-testing/troubleshooting-guide.md"
            "docs/e2e-testing/api-reference.md"
            "docs/e2e-testing/faq.md"
          )

          missing_docs=0
          for doc in "${required_docs[@]}"; do
            if [ ! -f "$doc" ]; then
              echo "::error::missing documentation: $doc"
              missing_docs=$((missing_docs + 1))
            else
              echo "✓ found: $doc"
            fi
          done

          if [ "$missing_docs" -ne 0 ]; then
            echo "::error::$missing_docs required documentation files missing"
            exit 1
          fi
          echo "✓ all required documentation exists"
      
      - name: Generate deployment readiness report
        # `if: always()` so a failed check still produces a report, and the report
        # states what actually happened. The previous version was a quoted heredoc
        # with four hard-coded checkmarks, so it asserted "Production readiness
        # verification completed" while the script it names did not exist - and
        # because the delimiter was quoted, `$(date ...)` was never expanded and
        # appeared literally in the published artifact.
        if: always()
        run: |
          set -euo pipefail
          mkdir -p reports
          {
            echo "# Deployment Readiness Report"
            echo
            echo "**Date**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo "**Commit**: ${{ github.sha }}"
            echo "**Tag**: ${{ github.ref_name }}"
            echo
            echo "## Verification Status"
            echo
            echo "| check | outcome |"
            echo "| --- | --- |"
            echo "| production readiness script | ${{ steps.readiness.outcome }} |"
            echo "| tests | ${{ steps.tests.outcome }} |"
            echo "| code quality | ${{ steps.lint.outcome }} |"
            echo "| documentation | ${{ steps.docs.outcome }} |"
            echo
            echo "Each outcome is the one GitHub recorded for the step named beside it."
            echo "This report does not assert success independently of those outcomes."
          } > reports/deployment-readiness.md
          cat reports/deployment-readiness.md

      - name: Upload readiness report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: deployment-readiness
          path: reports/deployment-readiness.md
          retention-days: 90
          if-no-files-found: error

  build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      
      - name: Build and push monolithic image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}-monolithic
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build and push microservices images
        run: |
          set +e  # Don't exit on error, we want to continue
          
          echo "Building microservices images..."
          
          # Build puller service
          echo "Building puller service..."
          docker build -f ./docker/Dockerfile.microservices \
            --build-arg SERVICE=puller \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}-puller" \
            . && docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}-puller"
          
          # Build event-processor service
          echo "Building event-processor service..."
          docker build -f ./docker/Dockerfile.microservices \
            --build-arg SERVICE=event-processor \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}-event-processor" \
            . && docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}-event-processor"
          
          # Build api-service
          echo "Building api-service..."
          docker build -f ./docker/Dockerfile.microservices \
            --build-arg SERVICE=api-service \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}-api-service" \
            . && docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}-api-service"
          
          # Build api-gateway
          echo "Building api-gateway..."
          docker build -f ./docker/Dockerfile.microservices \
            --build-arg SERVICE=api-gateway \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}-api-gateway" \
            . && docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}-api-gateway"
          
          echo "✓ Microservices image build/push completed"

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging'
    timeout-minutes: 15
    
    steps:
      - name: Check kubeconfig availability
        id: check-kube
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_STAGING }}
        run: |
          if [ -z "$KUBECONFIG_B64" ]; then
            echo "::error::KUBECONFIG_STAGING is not configured. Staging had no such check, so a missing secret produced an empty kubeconfig, every later step was masked, and the job reported success."
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        if: steps.check-kube.outputs.available == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: 'latest'

      - name: Configure kubeconfig
        run: |
          mkdir -p "${HOME}/.kube"
          echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > "${HOME}/.kube/config"
      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          bash scripts/deploy-staging.sh --monolithic

      - name: Run smoke tests
        run: |
          set -euo pipefail
          echo "Running smoke tests on staging..."
          if [ ! -x scripts/verify-staging.sh ]; then
            echo "::error::scripts/verify-staging.sh is missing or not executable. The fallback used to print kubectl output, which asserts nothing and always exits 0."
            exit 1
          fi
          bash scripts/verify-staging.sh

      - name: Notify deployment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            try {
              if (context.issue && context.issue.number) {
                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: '✓ Deployment to staging completed'
                });
                console.log('✓ Deployment notification posted');
              } else {
                console.log('⚠ No issue context available, skipping comment');
              }
            } catch (error) {
              console.log('⚠ Failed to post deployment notification:', error.message);
            }

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 30
    
    environment:
      name: production
      url: https://chainpulse.example.com
    
    steps:
      - name: Check kubeconfig availability
        id: check-kube
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_PRODUCTION }}
        run: |
          if [ -z "$KUBECONFIG_B64" ]; then
            echo "::error::KUBECONFIG_PRODUCTION is not configured. Every deployment step below would be skipped and this job would still conclude success - section 7.5 item 8 forbids reporting a Kubernetes deployment as successful when nothing was deployed."
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        if: steps.check-kube.outputs.available == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup kubectl
        if: steps.check-kube.outputs.available == 'true'
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: 'latest'

      - name: Configure kubeconfig
        if: steps.check-kube.outputs.available == 'true'
        run: |
          mkdir -p "${HOME}/.kube"
          echo "${{ secrets.KUBECONFIG_PRODUCTION }}" | base64 -d > "${HOME}/.kube/config"

      - name: Pre-deployment checks
        if: steps.check-kube.outputs.available == 'true'
        run: |
          set -euo pipefail
          script=scripts/verify-production-readiness.sh
          if [ ! -f "$script" ]; then
            echo "::error::$script does not exist. Reporting success without running it is how the readiness gate became decorative."
            exit 1
          fi
          bash "$script"

      - name: Deploy to production
        if: steps.check-kube.outputs.available == 'true'
        run: |
          echo "Deploying to production environment..."
          OVERLAY=monolithic bash scripts/run-k8s-deploy.sh up

      - name: Verify deployment
        if: steps.check-kube.outputs.available == 'true'
        run: |
          echo "Verifying production deployment..."
          NAMESPACE="chainpulse"
          kubectl get pods -n "${NAMESPACE}" -o wide
          kubectl rollout status deployment/chainpulse-monolithic -n "${NAMESPACE}" --timeout=300s
          # scripts/verify-production.sh does not exist; the rollout status
          # assertion above is the real check, so the masked call is removed
          # rather than left to imply a verification that never ran.

      - name: Create release notes
        if: steps.check-kube.outputs.available == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            
            const releaseNotes = `
            # Release ${tag}
            
            **Deployment Date**: ${new Date().toISOString()}
            **Commit**: ${{ github.sha }}
            
            ## Deployment Status
            
            ✅ Successfully deployed to production
            `;
            
            github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: \`Release \${tag}\`,
              body: releaseNotes,
              draft: false,
              prerelease: false
            });

      - name: Notify deployment
        if: steps.check-kube.outputs.available == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: '✅ Production deployment completed successfully'
            });

      - name: Post-deployment monitoring
        if: steps.check-kube.outputs.available == 'true'
        run: |
          echo "Starting post-deployment monitoring..."
          NAMESPACE="chainpulse"
          echo "Pods:"
          kubectl get pods -n "${NAMESPACE}" -o wide
          echo "Services:"
          kubectl get svc -n "${NAMESPACE}"
          echo "Deployments:"
          kubectl get deployments -n "${NAMESPACE}"

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: [verify, build, deploy-production]
    if: failure()
    timeout-minutes: 15
    
    steps:
      - name: Check kubeconfig availability
        id: check-kube
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_PRODUCTION }}
        run: |
          if [ -z "$KUBECONFIG_B64" ]; then
            echo "KUBECONFIG_PRODUCTION secret is not configured. Skipping rollback."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.check-kube.outputs.available == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup kubectl
        if: steps.check-kube.outputs.available == 'true'
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: 'latest'

      - name: Configure kubeconfig
        if: steps.check-kube.outputs.available == 'true'
        run: |
          mkdir -p "${HOME}/.kube"
          echo "${{ secrets.KUBECONFIG_PRODUCTION }}" | base64 -d > "${HOME}/.kube/config"

      - name: Initiate rollback
        if: steps.check-kube.outputs.available == 'true'
        run: |
          echo "Initiating rollback..."
          NAMESPACE="chainpulse"
          
          echo "Current deployment state:"
          kubectl rollout history deployment/chainpulse-monolithic -n "${NAMESPACE}" || true
          
          echo "Executing rollback..."
          kubectl rollout undo deployment/chainpulse-monolithic -n "${NAMESPACE}"
          kubectl rollout status deployment/chainpulse-monolithic -n "${NAMESPACE}" --timeout=300s
          
          echo "Rollback completed"

      - name: Verify rollback
        if: steps.check-kube.outputs.available == 'true'
        run: |
          echo "Verifying rollback..."
          NAMESPACE="chainpulse"
          kubectl get pods -n "${NAMESPACE}" -o wide
          kubectl get deployments -n "${NAMESPACE}"
          echo "Rollback verification completed"

      - name: Notify rollback
        if: steps.check-kube.outputs.available == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: '⚠️ Deployment failed and was rolled back. Please review the logs.'
            });
