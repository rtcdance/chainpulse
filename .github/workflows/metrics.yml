name: Performance Metrics

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  # D12: `master` is the remote default branch; without it in the list this
  # gate never fires on the branch that actually protects. main/develop are
  # kept for the existing branch layout.
  push:
    branches: [ main, master, develop ]
  pull_request:
    # Section 7.3: the chaos-soak-perf lane runs on nightly, before RC/tag, and on
    # hot-path PRs, and must not block the normal PR path. This filter is the
    # hot-path set - widen or narrow it deliberately rather than removing it.
    branches: [ main, master, develop ]
    paths:
      - 'pkg/evm/**'
      - 'pkg/services/processor/**'
      - 'pkg/plugins/pullers/**'
      - 'pkg/plugins/mq/**'
      - 'test/benchmarks/**'
      - 'scripts/acceptance/bench-gate.py'
      - 'scripts/acceptance/bench-prometheus.py'
      - '.github/workflows/metrics.yml'
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  GOPROXY: https://proxy.golang.org|https://goproxy.cn|direct

jobs:
  collect-metrics:
    name: Collect Performance Metrics
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: chainpulse
          POSTGRES_PASSWORD: chainpulse_test
          POSTGRES_DB: chainpulse_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Install pinned benchstat
        run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20261009192801-be2c69fb417e

      - name: Compare frozen source and candidate on the same runner
        run: |
          set -euo pipefail
          python3 scripts/bench/compare-micro.py \
            --base-sha 30c45b05485b4ecfb47ae5accd3b723c09fad4e1 --out metrics
          cp metrics/benchmark-results.txt benchmark-results.txt

      # The previous version of this workflow ran
      #   go test -run=TestPerformance ... -args -metrics-output=metrics/latency.json
      # but -metrics-output is not a registered flag, so the test binary aborted
      # with "flag provided but not defined" every time. The failure was swallowed
      # by `|| true` and an empty file was created by `touch`, so the latency and
      # throughput artifacts were always empty and nothing ever said so. Both
      # steps are removed rather than repaired: they were measuring nothing.
      - name: Collect profiles
        run: |
          set -euo pipefail
          mkdir -p metrics
          go test -run=TestPerformanceManager -memprofile=metrics/mem.prof ./test/e2e/
          go test -run=TestPerformanceManager -cpuprofile=metrics/cpu.prof ./test/e2e/
          go tool pprof -text metrics/mem.prof > metrics/memory-profile.txt
          go tool pprof -text metrics/cpu.prof > metrics/cpu-profile.txt

      - name: Generate metrics summary
        if: always()
        run: |
          set -euo pipefail
          mkdir -p metrics
          # A quoted heredoc would leave $(date ...) unexpanded in the artifact.
          {
            echo "# Performance Metrics Summary"
            echo
            echo "**Date**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo "**Commit**: ${{ github.sha }}"
            echo "**Branch**: ${{ github.ref_name }}"
            echo
            echo "## Benchmark results"
            echo
            echo '```'
            cat benchmark-results.txt
            echo '```'
            echo
            echo "## Gate result"
            echo
            echo '```json'
            cat metrics/bench-gate.json
            echo '```'
            echo
            echo "## Artifacts"
            echo
            for f in benchmark-results.txt metrics/bench-gate.json \
                     metrics/mem.prof metrics/cpu.prof; do
              if [ -s "$f" ]; then
                echo "- present: \`$f\`"
              else
                echo "- **missing or empty**: \`$f\`"
              fi
            done
          } > metrics/summary.md
          cat metrics/summary.md

      - name: Export metrics to Prometheus format
        if: always()
        run: |
          set -euo pipefail
          # Values are read from the gate output. The previous version emitted
          # hard-coded zeros for coverage and ops/sec, and a literal $(date +%s)
          # inside a quoted heredoc, so every exported number was fabricated.
          if [ ! -s metrics/bench-gate.json ]; then
            echo "::error::metrics/bench-gate.json is missing; refusing to emit fabricated metrics"
            exit 1
          fi
          python3 scripts/acceptance/bench-prometheus.py metrics/bench-gate.json \
            > metrics/prometheus.txt
          cat metrics/prometheus.txt

      - name: Upload metrics artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: performance-metrics
          path: |
            metrics/
            benchmark-results.txt
          retention-days: 90
          if-no-files-found: error

      - name: Add measured report to job summary
        if: always()
        run: |
          test -s metrics/summary.md
          cat metrics/summary.md >> "$GITHUB_STEP_SUMMARY"

  performance-regression-check:
    name: Check Performance Regression
    runs-on: ubuntu-latest
    needs: collect-metrics
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download metrics
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: performance-metrics
          # The artifact was uploaded from two paths (metrics/ and
          # benchmark-results.txt), so its root is the workspace root. Downloading
          # it to `metrics/` nests everything one level deeper, which is why the
          # previous version's `metrics/latency.json` check could never find its
          # file - and, being masked, never said so.
          path: .

      - name: Check for regressions
        run: |
          set -euo pipefail
          # This step used to define MAX_LATENCY_MS, MIN_THROUGHPUT_EPS and
          # MAX_MEMORY_MB, compare nothing against them, and end with
          # "✓ Regression check completed (data validation only)" behind a
          # continue-on-error. The thresholds were decoration. The comparison is
          # now made by the repository's own gate, against the recorded baseline.
          test -s benchmark-results.txt || {
            echo "::error::benchmark-results.txt was not downloaded; cannot check for regressions"
            exit 1
          }
          python3 scripts/acceptance/bench-gate.py \
            --bench-output benchmark-results.txt \
            --baseline metrics/paired-baseline.json \
            --command "go test -run '^$' -bench BenchmarkDecodeEventDataTransfer -benchmem -count=5 ./pkg/evm/" \
            --emit-json metrics/bench-gate-regression.json
