name: Integration & E2E Tests

# Runs separately from the main CI:
# - on demand (workflow_dispatch)
# - nightly on main/master
# - on PRs that touch test/ or pkg/services/
on:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Also run E2E tests'
        required: false
        default: 'true'
        type: boolean

  schedule:
    # Nightly at 02:00 UTC
    - cron: '0 2 * * *'

  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'test/**'
      - 'pkg/services/**'
      - 'pkg/infrastructure/**'

jobs:
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: chainpulse_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      kafka:
        image: confluentinc/cp-kafka:7.5.0
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: ''
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_NODE_ID: 1
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
        options: >-
          --health-cmd "kafka-broker-api-versions --bootstrap-server localhost:9092"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10
        ports:
          - 9092:9092

    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Run integration tests
      env:
        TEST_DATABASE_URL: postgres://test:test@localhost:5432/chainpulse_test?sslmode=disable
        TEST_REDIS_URL: localhost:6379
        TEST_KAFKA_BROKERS: localhost:9092
        DEPLOYMENT_MODE: monolithic
      run: |
        set -euo pipefail
        go test -json -race -timeout=10m -tags=integration \
          ./test/integration/... | tee integration-output.jsonl
        python3 scripts/acceptance/verify-tests.py \
          --jsonl integration-output.jsonl --min-tests 1 \
          --report integration-report.json

    - name: Upload integration test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: integration-results-${{ github.sha }}
        path: |
          test-results/
          *.log
        retention-days: 14

  contract:
    name: Contract Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: chainpulse
          POSTGRES_PASSWORD: chainpulse_test
          POSTGRES_DB: chainpulse_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      # Section 7.3 lists the contracts lane as "Postgres/Redis/Kafka ready".
      # A Kafka service is deliberately NOT provisioned here: the E09 redelivery
      # rehearsal cannot run in CI as written, because its createTopic helper
      # shells out to `docker exec <container> kafka-topics --bootstrap-server
      # localhost:9092`, and a GitHub service container is not reachable that way.
      # Adding a broker would therefore turn this job red at topic creation, not
      # exercise the rehearsal. See docs/project/2026-10-14-required-cases-lane.md.
    # F13: these are the names the contract tests actually read. This job used to
    # set TEST_REDIS_URL, which no test reads, and provisioned no database at all,
    # so every Postgres and Redis contract test skipped while the job still
    # reported success. See docs/project/2026-10-14-f13-contract-lane.md.
    env:
      CHAINPULSE_RUN_POSTGRES_INTEGRATION: '1'
      CHAINPULSE_TEST_DATABASE_URL: postgres://chainpulse:chainpulse_test@localhost:5432/chainpulse_test?sslmode=disable
      CHAINPULSE_RUN_REDIS_INTEGRATION: '1'
      CHAINPULSE_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        cache: true

    - name: Apply migrations
      run: |
        set -euo pipefail
        # The Postgres contract tests read an existing schema rather than
        # creating one, so the database must be migrated before they run.
        go run ./cmd/migrate/ -db "$CHAINPULSE_TEST_DATABASE_URL" -path migrations up

    - name: Run contract tests
      run: |
        set -euo pipefail
        # F13: --fail-on-unknown-skip is the guard that was missing. --min-tests 1
        # only catches an EMPTY suite; it passes happily when every Postgres and
        # Redis test skips, which is how this job reported green while the real
        # adapters were never exercised.
        #
        # test/acceptance is included because two section 9 scenarios are mapped
        # to tests that live there (E05 SIGTERM/crash, E09 DB/Redis failure) and
        # nothing else ran that directory. Both need the same Postgres and Redis
        # this job already provisions.
        #
        # -p 1 is not an optimisation: these two packages share one database and
        # are NOT concurrency-safe against each other. Running them in parallel
        # fails TestPostgresAtomicCommit, TestCanonicalDigestsAcrossRollbackAndRedelivery
        # and TestBackgroundWorkersReturnToBaseline; serially they pass. See
        # docs/project/2026-10-14-required-cases-lane.md.
        go test -json -race -timeout=10m -p 1 -tags=integration \
          ./test/contracts/... ./test/acceptance/... | tee contracts-output.jsonl
        # --required-lane makes the section 7.2 manifest an actual gate: the
        # listed tests must have RUN and PASSED. Without it the manifest was a
        # document no workflow read.
        #
        # --skip-allowlist declares the one skip this run produces. The Kafka
        # rehearsal is NOT in the manifest (its scenario E09 lists the DB and
        # Redis cases only), so the allowlist entry is not covering a required
        # case - but it is the MQ half of E09 and remains an open gap, recorded
        # in the allowlist itself with a reason, an owner and an expiry.
        python3 scripts/acceptance/verify-tests.py \
          --jsonl contracts-output.jsonl --min-tests 1 \
          --fail-on-unknown-skip \
          --skip-allowlist test/acceptance/skip-allowlist.json \
          --required-cases test/acceptance/required-cases.json \
          --required-lane contracts --required-lane e2e \
          --report contracts-report.json

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    # Only run E2E if explicitly requested or nightly
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_e2e == 'true')
    needs: [ integration ]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: chainpulse_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Run E2E tests
      env:
        TEST_DATABASE_URL: postgres://test:test@localhost:5432/chainpulse_test?sslmode=disable
        TEST_REDIS_URL: localhost:6379
        DEPLOYMENT_MODE: monolithic
      run: |
        set -euo pipefail
        go test -json -race -timeout=20m -tags=e2e \
          ./test/e2e/... | tee e2e-output.jsonl
        python3 scripts/acceptance/verify-tests.py \
          --jsonl e2e-output.jsonl --min-tests 1 \
          --report e2e-report.json

    - name: Upload E2E test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: e2e-results-${{ github.sha }}
        path: |
          test-results/
          *.log
        retention-days: 14

  notify:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [ integration, contract, e2e ]
    if: failure() && github.event_name == 'schedule'
    steps:
    - name: Create GitHub Issue on nightly failure
      uses: actions/github-script@v9
      with:
        script: |
          const date = new Date().toISOString().split('T')[0];
          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `[Nightly] Integration/E2E tests failed on ${date}`,
            body: [
              `## Nightly test failure`,
              ``,
              `**Date**: ${date}`,
              `**Run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
              ``,
              `Please investigate and fix the failing tests.`,
            ].join('\n'),
            labels: ['bug', 'test-failure', 'nightly'],
          });
