      - name: Check coverage threshold
        id: coverage-check
        run: |
          if [ -f coverage.out ] && [ -s coverage.out ]; then
            COVERAGE=$(go tool cover -func=coverage.out 2>/dev/null | grep total | awk '{print $3}' | sed 's/%//' || echo "0")
            echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
            echo "Total coverage: ${COVERAGE}%"
            
            if [ -z "$COVERAGE" ] || [ "$COVERAGE" = "0" ]; then
              echo "⚠ Could not calculate coverage, skipping threshold check"
              echo "status=no-data" >> $GITHUB_OUTPUT
            elif (( $(echo "$COVERAGE < $MIN_COVERAGE" | bc -l) )); then
              echo "⚠ Coverage ${COVERAGE}% is below minimum ${MIN_COVERAGE}%"
              echo "Note: This is a warning, not a failure. Coverage data may be incomplete."
              echo "status=warning" >> $GITHUB_OUTPUT
            else
              echo "✓ Coverage ${COVERAGE}% meets minimum ${MIN_COVERAGE}%"
              echo "status=passed" >> $GITHUB_OUTPUT
            fi
          else
            echo "coverage=0" >> $GITHUB_OUTPUT
            echo "status=no-data" >> $GITHUB_OUTPUT
            echo "⚠ No coverage data available, skipping threshold check"
          fi
      
      - name: Generate coverage badge
        run: |
          COVERAGE=${{ steps.coverage-check.outputs.coverage }}
          COLOR="lightgrey"
          
          if [ -z "$COVERAGE" ] || [ "$COVERAGE" = "0" ]; then
            COVERAGE="0"
            COLOR="lightgrey"
          elif (( $(echo "$COVERAGE >= 90" | bc -l) )); then
            COLOR="brightgreen"
          elif (( $(echo "$COVERAGE >= 80" | bc -l) )); then
            COLOR="green"
          elif (( $(echo "$COVERAGE >= 70" | bc -l) )); then
            COLOR="yellow"
          elif (( $(echo "$COVERAGE >= 60" | bc -l) )); then
            COLOR="orange"
          else
            COLOR="red"
          fi
          
          # Generate badge JSON with error handling
          cat > coverage-badge.json << EOF || true
          {
            "schemaVersion": 1,
            "label": "coverage",
            "message": "${COVERAGE}%",
            "color": "${COLOR}"
          }
          EOF
          
          echo "✓ Coverage badge generated: ${COVERAGE}% (${COLOR})"
      
      - name: Generate coverage summary
        run: |
          COVERAGE=${{ steps.coverage-check.outputs.coverage }}
          STATUS=${{ steps.coverage-check.outputs.status }}
          
          cat > coverage-summary.md << EOF || true
          # Code Coverage Report
          
          **Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Commit**: ${{ github.sha }}
          **Branch**: ${{ github.ref_name }}
          
          ## Overall Coverage
          
          ![Coverage](https://img.shields.io/badge/coverage-${COVERAGE}%25-$([ "$STATUS" = "passed" ] && echo "green" || echo "orange"))
          
          **Total Coverage**: ${COVERAGE}%
          **Minimum Required**: ${MIN_COVERAGE}%
          **Status**: $([ "$STATUS" = "passed" ] && echo "✓ PASSED" || echo "⚠ WARNING")
          
          ## Coverage Reports
          
          - **[File-Level Coverage](coverage-files-detailed.txt)** - Coverage for all files in pkg/ and subdirectories
          - **[Component Coverage](coverage-by-component.txt)** - Coverage grouped by component
          - **[Detailed Coverage](coverage-detailed.txt)** - Line-by-line coverage details
          - **[HTML Report](coverage.html)** - Interactive HTML coverage visualization
          
          ## Coverage by Component
          
          $(if [ -f coverage-by-component.txt ]; then cat coverage-by-component.txt; else echo "N/A"; fi)
          
          ## File-Level Coverage Summary
          
          See [coverage-files-detailed.txt](coverage-files-detailed.txt) for complete file-level coverage of all pkg/ files and subdirectories.
          EOF
          
          cat coverage-summary.md
          echo "✓ Coverage summary generated successfully"
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          flags: pkg
          name: codecov-pkg
          fail_ci_if_error: false
        continue-on-error: true
      
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage.out
            coverage.html
            coverage-enhanced.html
            coverage-detailed.txt
            coverage-files-detailed.txt
            coverage-by-component.txt
            coverage-summary.md
            coverage-badge.json
          retention-days: 90
          if-no-files-found: ignore
      
      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const summary = fs.readFileSync('coverage-summary.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: summary
              });
            } catch (error) {
              console.log('⚠ Could not post coverage comment:', error.message);
            }
        continue-on-error: true
      
      - name: Update coverage badge in README
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          # This would update the README with the new coverage badge
          # For now, just output the badge URL
          echo "Coverage badge: https://img.shields.io/badge/coverage-${{ steps.coverage-check.outputs.coverage }}%25-green"

  coverage-diff:
    name: Coverage Diff
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: coverage
    
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
      
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: base
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      
      - name: Download PR coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-reports
          path: pr-coverage/
        continue-on-error: true
      
      - name: Generate base coverage
        working-directory: base
        run: |
          go test -coverprofile=../base-coverage.out -covermode=atomic -timeout 30m ./pkg/... || true
      
      - name: Compare coverage
        run: |
          if [ -f pr-coverage/coverage.out ] && [ -s pr-coverage/coverage.out ] && [ -f base-coverage.out ] && [ -s base-coverage.out ]; then
            PR_COVERAGE=$(go tool cover -func=pr-coverage/coverage.out 2>/dev/null | grep total | awk '{print $3}' | sed 's/%//' || echo "0")
            BASE_COVERAGE=$(go tool cover -func=base-coverage.out 2>/dev/null | grep total | awk '{print $3}' | sed 's/%//' || echo "0")
            
            DIFF=$(echo "$PR_COVERAGE - $BASE_COVERAGE" | bc 2>/dev/null || echo "0")
            
            cat > coverage-diff.md << EOF || true
            # Coverage Comparison (pkg/ only)
            
            **Base Branch**: ${BASE_COVERAGE}%
            **PR Branch**: ${PR_COVERAGE}%
            **Difference**: ${DIFF}%
            
            $([ $(echo "$DIFF >= 0" | bc -l 2>/dev/null || echo "0") -eq 1 ] && echo "✓ Coverage improved!" || echo "⚠ Coverage decreased")
            EOF
          else
            cat > coverage-diff.md << EOF || true
            # Coverage Comparison
            
            ⚠ Could not generate coverage comparison. Coverage data may be incomplete.
            EOF
          fi
          
          cat coverage-diff.md
      
      - name: Comment PR with diff
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const diff = fs.readFileSync('coverage-diff.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: diff
              });
            } catch (error) {
              console.log('⚠ Could not post coverage diff comment:', error.message);
            }
        continue-on-error: true
