name: E2E Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  GO_VERSION: '1.26'
  MIN_COVERAGE: 40
  POSTGRES_VERSION: '15'
  REDIS_VERSION: '7'

jobs:
  test:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: chainpulse
          POSTGRES_PASSWORD: chainpulse_test
          POSTGRES_DB: chainpulse_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      
      - name: Install Foundry (for Anvil)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
        continue-on-error: true
      
      - name: Start Anvil
        run: |
          if command -v anvil &> /dev/null; then
            # Start Anvil in the background with proper configuration
            anvil \
              --host 0.0.0.0 \
              --port 8545 \
              --chain-id 31337 \
              --accounts 10 \
              --balance 10000 \
              > /tmp/anvil.log 2>&1 &
            
            ANVIL_PID=$!
            echo "Anvil started with PID: $ANVIL_PID"
            echo "ANVIL_PID=$ANVIL_PID" >> $GITHUB_ENV
            
            # Wait for Anvil to be ready
            echo "Waiting for Anvil to be ready..."
            for i in {1..30}; do
              if curl -s http://localhost:8545 -X POST -H "Content-Type: application/json" -d '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' > /dev/null 2>&1; then
                echo "✓ Anvil is ready"
                break
              fi
              if [ $i -eq 30 ]; then
                echo "✗ Anvil failed to start"
                cat /tmp/anvil.log
                exit 1
              fi
              echo "Attempt $i/30: Waiting for Anvil..."
              sleep 1
            done
          else
            echo "⚠ Anvil not available, tests will run without it"
          fi
        continue-on-error: true
      
      - name: Install dependencies
        run: |
          go mod download
          go mod verify
          go install github.com/wadey/gocovmerge@latest || true
      
      - name: Run unit tests
        run: |
          set -euo pipefail
          # Clear Go cache to ensure fresh test runs
          go clean -testcache

          echo "Running unit tests for all pkg/ packages (JSONL + coverage)..."
          # `pipefail` propagates a go-test failure; the verifier then catches
          # the "exit 0 but nothing actually ran" cases (empty run, no tests).
          go test -json -short -coverprofile=coverage-unit.out -covermode=atomic \
            -timeout 120s -p 4 ./pkg/... | tee unit-test-output.jsonl

          python3 scripts/acceptance/verify-tests.py \
            --jsonl unit-test-output.jsonl \
            --min-tests 1 \
            --report unit-tests-report.json

          if [ ! -s coverage-unit.out ]; then
            echo "✗ unit test coverage profile missing or empty"
            exit 1
          fi
          echo "✓ unit tests passed; coverage profile written"
      
      - name: Run integration tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: chainpulse
          POSTGRES_PASSWORD: chainpulse_test
          POSTGRES_DB: chainpulse_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          set -euo pipefail
          go test -json -short -coverprofile=coverage-integration.out -covermode=atomic \
            -timeout 15m ./test/integration/... | tee integration-test-output.jsonl

          python3 scripts/acceptance/verify-tests.py \
            --jsonl integration-test-output.jsonl \
            --report integration-tests-report.json
          echo "✓ integration tests passed"
      
      - name: Analyze unit test coverage gaps
        if: always()
        run: |
          echo "=== Analyzing Unit Test Coverage Gaps ==="
          
          # List all pkg subdirectories with test files
          echo ""
          echo "Packages with test files:"
          find pkg -name "*_test.go" -type f | cut -d'/' -f1-2 | sort -u > /tmp/packages_with_tests.txt
          cat /tmp/packages_with_tests.txt
          
          # List packages in coverage file
          echo ""
          echo "Packages in unit test coverage file:"
          if [ -f coverage-unit.out ] && [ -s coverage-unit.out ]; then
            go tool cover -func=coverage-unit.out 2>/dev/null | grep "github.com/rtcdance/chainpulse/pkg" | cut -d'/' -f1-2 | sort -u > /tmp/packages_in_coverage.txt
            cat /tmp/packages_in_coverage.txt
            
            # Find missing packages
            echo ""
            echo "Packages with tests but missing from unit test coverage:"
            comm -23 /tmp/packages_with_tests.txt /tmp/packages_in_coverage.txt || echo "All packages have coverage data"
          else
            echo "No unit test coverage file found"
          fi
      
      - name: Run E2E tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: chainpulse
          POSTGRES_PASSWORD: chainpulse_test
          POSTGRES_DB: chainpulse_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          ANVIL_URL: http://localhost:8545
        run: |
          set -euo pipefail
          go test -json -short -coverprofile=coverage-e2e.out -covermode=atomic \
            -timeout 20m ./test/e2e/... | tee e2e-test-output.jsonl

          python3 scripts/acceptance/verify-tests.py \
            --jsonl e2e-test-output.jsonl \
            --report e2e-tests-report.json
          echo "✓ E2E tests passed"
      
      - name: Merge coverage reports
        run: |
          set -euo pipefail
          if [ ! -s coverage-unit.out ]; then
            echo "✗ No unit test coverage profile — refusing to fabricate an empty report"
            exit 1
          fi
          cp coverage-unit.out coverage.out
          echo "✓ Using unit test coverage (pkg/ only)"
      
      - name: Generate coverage report
        run: |
          set -euo pipefail
          go tool cover -html=coverage.out -o coverage.html
          go tool cover -func=coverage.out -o coverage.txt
          echo "✓ Coverage reports generated successfully"
      
      - name: Check coverage threshold
        run: |
          set -euo pipefail
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          if [ -z "$COVERAGE" ]; then
            echo "✗ Could not parse coverage total — failing instead of skipping"
            exit 1
          fi
          echo "Total coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < $MIN_COVERAGE" | bc -l) )); then
            echo "✗ Coverage ${COVERAGE}% is below minimum ${MIN_COVERAGE}%"
            exit 1
          fi
          echo "✓ Coverage ${COVERAGE}% meets minimum ${MIN_COVERAGE}%"
      
      - name: Generate test summary
        if: always()
        run: |
          echo "## Test Execution Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for suite in unit integration e2e; do
            report="${suite}-tests-report.json"
            if [ -f "$report" ]; then
              echo "### ${suite} tests" >> "$GITHUB_STEP_SUMMARY"
              echo '```json' >> "$GITHUB_STEP_SUMMARY"
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          if [ -s coverage.out ]; then
            echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
            echo "- Total: $(go tool cover -func=coverage.out | grep total | awk '{print $3}')" >> "$GITHUB_STEP_SUMMARY"
          fi
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.out
          flags: unittests,integration
          name: codecov-umbrella
          fail_ci_if_error: false
        continue-on-error: true
      
      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            coverage.out
            coverage.html
            coverage.txt
          retention-days: 30
          if-no-files-found: error
      
      - name: Upload test evidence (required)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-evidence
          path: |
            *-test-output.jsonl
            *-tests-report.json
            *.log
            test/integration/*.log
          retention-days: 30
          if-no-files-found: error
      
      - name: Cleanup Anvil
        if: always()
        run: |
          if [ ! -z "$ANVIL_PID" ]; then
            echo "Stopping Anvil (PID: $ANVIL_PID)..."
            kill $ANVIL_PID 2>/dev/null || true
            sleep 1
            kill -9 $ANVIL_PID 2>/dev/null || true
            echo "✓ Anvil stopped"
          fi
        continue-on-error: true

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      
      - name: Install golangci-lint via go install
        run: |
          echo "Installing golangci-lint latest..."
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          "$(go env GOPATH)/bin/golangci-lint" --version
          echo "✓ golangci-lint installed successfully"
      
      - name: Run golangci-lint
        run: |
          echo "Running golangci-lint checks..."
          GODEBUG=gotypesalias=1 "$(go env GOPATH)/bin/golangci-lint" run --timeout=5m --out-format=colored-line-number ./...
          echo "✓ golangci-lint completed successfully"
      
      - name: Report Lint Status
        if: always()
        run: |
          echo "## Lint Job Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✓ golangci-lint: **PASSED**" >> $GITHUB_STEP_SUMMARY
          echo "- Method: go install (latest)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- Go Version: ${{ env.GO_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- golangci-lint Version: latest (compatible with Go 1.24.0)" >> $GITHUB_STEP_SUMMARY
          echo "- Timeout: 5m" >> $GITHUB_STEP_SUMMARY

  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      
      - name: Build monolithic service
        run: |
          go build -v -o bin/chainpulse-monolithic ./cmd/monolithic/chainpulse
      
      - name: Build microservices
        run: |
          go build -v -o bin/puller ./cmd/microservices/puller
          go build -v -o bin/event-processor ./cmd/microservices/event-processor
          go build -v -o bin/api-service ./cmd/microservices/api-service
          go build -v -o bin/api-gateway ./cmd/microservices/api-gateway
      
      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: bin/
          retention-days: 7
