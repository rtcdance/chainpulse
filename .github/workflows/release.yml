name: Release

on:
  push:
    tags:
      - 'v*'

env:
  GOPROXY: https://proxy.golang.org|https://goproxy.cn|direct
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version-file: go.mod
        cache: true

    - name: Run tests
      run: go test -v -race ./pkg/...

  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            extension: .exe
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version-file: go.mod
        cache: true

    - name: Build monolithic
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: |
        output="chainpulse-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.extension }}"
        go build -v -ldflags "-s -w -X main.Version=${{ github.ref_name }}" \
          -o "dist/${output}" ./cmd/monolithic/chainpulse

    - name: Build microservices
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: |
        for svc in puller event-processor api-service api-gateway; do
          output="${svc}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.extension }}"
          go build -v -ldflags "-s -w -X main.Version=${{ github.ref_name }}" \
            -o "dist/${output}" ./cmd/microservices/${svc}
        done

    - name: Upload artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
        path: dist/*

  docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
    - name: Log in to Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=tag
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}

    - name: Build and push monolithic
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: .
        file: ./docker/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push microservices
      run: |
        for svc in puller event-processor api-service api-gateway; do
          echo "Building ${svc}..."
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file docker/Dockerfile.microservices \
            --build-arg SERVICE=${svc} \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${svc}:${{ github.ref_name }} \
            --push \
            .
        done

    # Section 7.5 item 3: an SPDX-JSON SBOM ships with every release for every
    # published image. This workflow only fires on tag pushes (`on.push.tags`),
    # never on pull requests, so a failing SBOM step blocks the release outright
    # - no continue-on-error / non-blocking exemption applies here (§7.3: a gate
    # that cannot fail is decorative). syft pulls via the credentials the
    # login-action step above wrote to ~/.docker/config.json.
    - name: SBOM - monolithic image
      uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      with:
        image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
        format: spdx-json
        output-file: sbom/chainpulse-monolithic.spdx.json
        upload-artifact: 'false'
        upload-release-assets: 'false'

    - name: SBOM - puller image
      uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      with:
        image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/puller:${{ github.ref_name }}
        format: spdx-json
        output-file: sbom/chainpulse-puller.spdx.json
        upload-artifact: 'false'
        upload-release-assets: 'false'

    - name: SBOM - event-processor image
      uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      with:
        image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/event-processor:${{ github.ref_name }}
        format: spdx-json
        output-file: sbom/chainpulse-event-processor.spdx.json
        upload-artifact: 'false'
        upload-release-assets: 'false'

    - name: SBOM - api-service image
      uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      with:
        image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api-service:${{ github.ref_name }}
        format: spdx-json
        output-file: sbom/chainpulse-api-service.spdx.json
        upload-artifact: 'false'
        upload-release-assets: 'false'

    - name: SBOM - api-gateway image
      uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      with:
        image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api-gateway:${{ github.ref_name }}
        format: spdx-json
        output-file: sbom/chainpulse-api-gateway.spdx.json
        upload-artifact: 'false'
        upload-release-assets: 'false'

    - name: Upload image SBOMs
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: sbom-images
        path: sbom/
        if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, docker]
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - name: Download all artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        path: dist
        pattern: binaries-*

    - name: Download image SBOMs
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: sbom-images
        path: sbom

    # §7.5 item 3 (binaries half): one SPDX-JSON SBOM over every downloaded
    # platform binary, so the release carries checksums + SBOM for the same
    # artifact set. Lives under sbom/ not dist/, so the checksums.sh guards
    # (which count binaries-* directories) are unaffected.
    - name: SBOM - release binaries
      uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      with:
        path: dist
        format: spdx-json
        output-file: sbom/chainpulse-${{ github.ref_name }}-binaries.spdx.json
        upload-artifact: 'false'
        upload-release-assets: 'false'

    - name: Create checksums
      # Section 7.5 item 3 asks for this loop to be fixed: it wrote
      # `sha256sum * > ../checksums.txt` from inside the per-directory loop, so
      # every iteration truncated the file and only the last platform's checksums
      # survived. With five matrix platforms and five binaries each, 20 of 25
      # checksums were silently dropped and the truncated manifest was published
      # as if complete. The logic now lives in a script the negative-case suite
      # can drive, so the guards are themselves regression-tested.
      run: |
        set -euo pipefail
        bash scripts/acceptance/checksums.sh dist

    - name: Create Release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
      with:
        files: |
          dist/**/*
          sbom/**/*.spdx.json
        generate_release_notes: true
        draft: false
        prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
