name: Release

on:
  push:
    tags:
      - 'v*'

env:
  GO_VERSION: '1.24'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Run tests
      run: go test -v -race ./pkg/...

  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            extension: .exe
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Build monolithic
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: |
        output="chainpulse-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.extension }}"
        go build -v -ldflags "-s -w -X main.Version=${{ github.ref_name }}" \
          -o "dist/${output}" ./cmd/monolithic/chainpulse

    - name: Build microservices
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: |
        for svc in puller indexer query gateway; do
          output="${svc}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.extension }}"
          go build -v -ldflags "-s -w -X main.Version=${{ github.ref_name }}" \
            -o "dist/${output}" ./cmd/microservices/${svc}
        done

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
        path: dist/*

  docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=tag
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}

    - name: Build and push monolithic
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile.monolithic
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push microservices
      run: |
        for svc in puller indexer query gateway; do
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file docker/Dockerfile.${svc} \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${svc}:${{ github.ref_name }} \
            --push \
            .
        done

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, docker]
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist
        pattern: binaries-*

    - name: Create checksums
      run: |
        cd dist
        for dir in binaries-*; do
          cd "$dir"
          sha256sum * > ../checksums.txt
          cd ..
        done

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/**/*
        generate_release_notes: true
        draft: false
        prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
